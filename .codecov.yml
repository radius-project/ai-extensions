# yaml-language-server: $schema=https://www.schemastore.org/codecov.json
---
codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        informational: true
        target: auto
        threshold: 0%
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: false
