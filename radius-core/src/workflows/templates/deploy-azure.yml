# This workflow is auto-generated by Radius to run rad commands against an
# environment. It creates an ephemeral k3d cluster for the Radius control plane,
# connects to the user's target cluster (EKS/AKS), restores persisted state, runs
# the requested rad commands (deploying by default), then persists state again and
# tears the cluster down. This is the run-rad-commands action in the two-action
# Repo Radius model (the other being verify-cloud-auth).
name: Radius - Run rad Commands

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment name'
        required: true
        default: '{{ENV}}'
      image:
        description: 'Container image for the application'
        required: false
        default: ''
      rad_commands:
        # The Repo Radius dispatch contract. A single rad CLI command string, or a
        # JSON-encoded array of command strings run in order, with the `rad` prefix
        # omitted (e.g. `deploy .radius/app.bicep --environment dev` or
        # `["deploy .radius/app.bicep --environment dev", "app graph my-app -o json"]`).
        # Commands run verbatim, so the caller must include any flags a command needs —
        # e.g. `--environment <name>` for `deploy`, and `--parameters` (image, password,
        # etc.) the app expects. Each command is validated against the allowed-command
        # set before anything runs. When empty, the workflow runs its default
        # `rad deploy` of `.radius/app.bicep` with the image/password parameters wired
        # up below.
        description: 'rad CLI command string, or JSON array of command strings (rad prefix omitted, run verbatim). Overrides the default deploy.'
        required: false
        default: ''
  # Auto-trigger after the Verify Credentials workflow completes. The extension's
  # environment-setup flow dispatches only the verify workflow; this chain starts
  # the deploy once verify succeeds (the job-level `if` gates on the conclusion).
  workflow_run:
    workflows: ["Radius - Verify Credentials"]
    types: [completed]

permissions:
  id-token: write
  contents: write
  packages: write

env:
  ENVIRONMENT: ${{ inputs.environment || '{{ENV}}' }}
  APP_FILE: '{{APP_FILE}}'
  APP_IMAGE: ${{ inputs.image || github.sha || 'latest' }}
  RESOURCE_TYPES_CONTRIB_REPO: https://github.com/radius-project/resource-types-contrib.git
  RESOURCE_TYPES_CONTRIB_REF: main

jobs:
  deploy:
    name: Deploy with Radius
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || '{{ENV}}' }}
    # On a workflow_dispatch run unconditionally; on a workflow_run event only
    # proceed when the upstream Verify Credentials run succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get target cluster kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "RADIUS_TARGET_KUBECONFIG=$HOME/.kube/target-cluster" >> "$GITHUB_ENV"

      - name: Connect to AKS cluster
        if: ${{ vars.AZURE_AKS_CLUSTER_NAME != '' }}
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_AKS_CLUSTER_NAME }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --file "$RADIUS_TARGET_KUBECONFIG"

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create ephemeral Radius control plane cluster
        run: |
          k3d cluster create radius-cp \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${{ github.workspace }}/:/app/demo" \
            --k3s-arg "--disable=traefik@server:*" \
            --wait
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Install Radius CLI
        run: |
          wget -q "https://raw.githubusercontent.com/radius-project/radius/main/deploy/install.sh" -O - | /bin/bash -s edge
          rad version

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Create target-kubeconfig secret
        # The chart's targetCluster seam mounts this secret into applications-rp,
        # dynamic-rp, and bicep-de at install time and sets RADIUS_TARGET_KUBECONFIG,
        # so the secret must exist before `rad install`.
        run: |
          if [ ! -f "$RADIUS_TARGET_KUBECONFIG" ]; then
            echo "No target kubeconfig; resources will deploy to the control-plane cluster."
            exit 0
          fi
          kubectl create namespace radius-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic target-kubeconfig \
            --namespace radius-system \
            --from-file=kubeconfig="$RADIUS_TARGET_KUBECONFIG" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Radius on control plane
        run: |
          # When a target kubeconfig is present, enable the chart's targetCluster
          # seam. It mounts the target-kubeconfig secret into applications-rp,
          # dynamic-rp, and bicep-de and sets RADIUS_TARGET_KUBECONFIG so recipe
          # execution and directly-rendered resources target the external cluster.
          # The Terraform state backend deliberately stays on the control plane.
          #
          # database.enabled=true installs the control-plane PostgreSQL so durable
          # Radius state can be backed up and restored by `rad shutdown`/`rad startup`.
          TARGET_FLAGS=()
          if [ -f "$RADIUS_TARGET_KUBECONFIG" ]; then
            TARGET_FLAGS+=(--set global.targetCluster.enabled=true)
          fi
          rad install kubernetes \
            --set database.enabled=true \
            --set rp.publicEndpointOverride=localhost \
            --set dynamicrp.buildkit.enabled=true \
            "${TARGET_FLAGS[@]}"
          kubectl wait --for=condition=Available deployment --all -n radius-system --timeout=300s

      - name: Project cloud OIDC tokens into Radius pods
        run: |
          # Mint GitHub OIDC tokens and mount them where Radius expects them.
          # GitHub Actions is already a trusted OIDC issuer for both AWS and Azure
          # (via the CloudFormation template / AAD federated credential), so no
          # custom issuer setup is needed.

          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "Projecting Azure OIDC token..."
            AZ_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
            # The secret data key becomes the mounted file name, so it must be
            # 'azure-identity-token' -- the file Radius and the Terraform azurerm
            # provider read from /var/run/secrets/azure/tokens/.
            kubectl create secret generic azure-oidc-token -n radius-system \
              --from-literal=azure-identity-token="$AZ_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          fi

          # Mount the projected token at the fixed paths Radius reads from. The
          # cloud identity selectors (AWS role ARN, Azure client/tenant id) are NOT
          # set as SDK-native env vars here -- they come from the UCP credential
          # registered later via `rad credential register`. We only project the raw
          # token file that the credential needs for the federated token exchange.

          # Azure workload identity: the Go UCPCredential (applications-rp), the
          # .NET Bicep DE (bicep-de) and the Terraform azurerm provider (dynamic-rp)
          # all read /var/run/secrets/azure/tokens/azure-identity-token.
          # AZURE_FEDERATED_TOKEN_FILE is still required because armauth builds the
          # WorkloadIdentityCredential with an empty TokenFilePath and falls back to
          # this env var to locate the token.
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            AZ_PATCH='[
              {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"azure-oidc-token","secret":{"secretName":"azure-oidc-token"}}},
              {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"azure-oidc-token","mountPath":"/var/run/secrets/azure/tokens","readOnly":true}},
              {"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"AZURE_FEDERATED_TOKEN_FILE","value":"/var/run/secrets/azure/tokens/azure-identity-token"}}
            ]'
            for deploy in applications-rp dynamic-rp bicep-de; do
              kubectl patch deployment $deploy -n radius-system --type=json -p="$AZ_PATCH" 2>/dev/null || true
            done
          fi

          # Wait for any patched deployments to roll out.
          for deploy in applications-rp dynamic-rp bicep-de ucp; do
            kubectl rollout status deployment/$deploy -n radius-system --timeout=300s || true
          done
          echo "✅ Cloud OIDC tokens projected into Radius pods."

      - name: Refresh external deployment target credentials
        run: |
          TARGET_KUBECONFIG="$RADIUS_TARGET_KUBECONFIG"

          if [ ! -f "$TARGET_KUBECONFIG" ]; then
            echo "No target kubeconfig found, resources will deploy to k3d cluster"
            exit 0
          fi

          # Update the secret the chart mounted at install with the refreshed
          # kubeconfig, then restart the recipe-executing pods so they re-read it.
          # The chart owns the volume mount and RADIUS_TARGET_KUBECONFIG env var via
          # global.targetCluster.enabled, so no manual deployment patching is needed.
          # All three pods honor RADIUS_TARGET_KUBECONFIG natively: applications-rp
          # (direct-rendered resources) and dynamic-rp (Terraform kubernetes provider)
          # via the cluster access resolver, and bicep-de (Bicep 'extension kubernetes'
          # provider). The Terraform state backend deliberately stays on the
          # control-plane cluster, so no backend override is needed here.
          kubectl create secret generic target-kubeconfig --namespace radius-system \
            --from-file=kubeconfig="$TARGET_KUBECONFIG" --dry-run=client -o yaml | kubectl apply -f -
          for deploy in applications-rp dynamic-rp bicep-de; do
            kubectl rollout restart deployment/$deploy -n radius-system
          done

          echo "Waiting for rollouts..."
          kubectl rollout status deployment/applications-rp -n radius-system --timeout=300s
          kubectl rollout status deployment/dynamic-rp -n radius-system --timeout=300s
          kubectl rollout status deployment/bicep-de -n radius-system --timeout=300s
          echo "External deployment target configured."

      - name: Configure Radius workspace
        run: |
          NAMESPACE="${{ vars.KUBERNETES_NAMESPACE || 'default' }}"

          # Ensure namespace exists on target cluster before Radius deploys into it.
          TARGET_KUBECONFIG="$RADIUS_TARGET_KUBECONFIG"
          if [ -f "$TARGET_KUBECONFIG" ]; then
            echo "Ensuring namespace $NAMESPACE exists on target cluster..."
            kubectl --kubeconfig "$TARGET_KUBECONFIG" get namespace "$NAMESPACE" 2>/dev/null ||               kubectl --kubeconfig "$TARGET_KUBECONFIG" create namespace "$NAMESPACE"
          fi

          # The Radius.Core/environments resource (with its recipe pack and
          # cloud providers) is created later via Bicep. `rad install kubernetes`
          # already creates the 'default' resource group server-side, but we create
          # it explicitly (idempotent) as a defensive measure against older control
          # planes, then set up the local CLI workspace and point it at that group.
          rad workspace create kubernetes default
          rad group create default
          rad group switch default

      - name: Restore Radius state (rad startup)
        run: |
          # rad startup restores the control-plane PostgreSQL databases and the
          # Terraform recipe-state Secrets saved by the previous run's `rad shutdown`
          # from the `radius-state` git orphan branch, so commands plan against prior
          # state instead of an empty backend. On the first ever run there is nothing
          # to restore and it is a no-op. It needs the workspace created above and
          # waits for PostgreSQL to be ready itself. Configure a git identity so it can
          # manage the state branch.
          git config --global user.email "radius-deploy@users.noreply.github.com"
          git config --global user.name "radius-deploy"
          rad startup

      - name: Register cloud credentials with Radius
        run: |
          # Register the cloud identity with Radius using its UCP credential model.
          # Radius stores only the identity selector (AWS role ARN / Azure client +
          # tenant id); the short-lived token is read at runtime from the GitHub
          # OIDC token file projected into the pods in the earlier step. This keeps
          # the credential visible to `rad credential show`, rotatable, and usable
          # by both the Bicep and Terraform code paths.
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "Registering Azure workload identity credential..."
            rad credential register azure wi \
              --client-id "${{ vars.AZURE_CLIENT_ID }}" \
              --tenant-id "${{ vars.AZURE_TENANT_ID }}"
          fi
          echo "✅ Cloud credentials registered with Radius."

      - name: Clone resource-types-contrib and register resource types
        run: |
          git clone --depth 1 --branch "${{ env.RESOURCE_TYPES_CONTRIB_REF }}" "${{ env.RESOURCE_TYPES_CONTRIB_REPO }}" /tmp/resource-types-contrib

          for TYPE_YAML in \
            Compute/containerImages/containerImages.yaml; do
            if [ -f "/tmp/resource-types-contrib/$TYPE_YAML" ]; then
              echo "Registering $TYPE_YAML..."
              rad resource-type create -f "/tmp/resource-types-contrib/$TYPE_YAML" || \
                (echo "Retrying after 5s..." && sleep 5 && rad resource-type create -f "/tmp/resource-types-contrib/$TYPE_YAML")
            else
              echo "Skipping $TYPE_YAML (not found)"
            fi
          done
          echo "✅ Resource types registered"

          # Build a local Bicep extension from the containerImages type definition.
          CONTAINER_IMAGES_YAML="/tmp/resource-types-contrib/Compute/containerImages/containerImages.yaml"
          if [ -f "$CONTAINER_IMAGES_YAML" ]; then
            echo "Building local Bicep extension for containerImages..."
            rad bicep publish-extension -f "$CONTAINER_IMAGES_YAML" --target ./radiuscompute.tgz --force
            echo "✅ radiuscompute.tgz built"
          fi

      - name: Create bicepconfig for deployment
        run: |
          cat > bicepconfig.json << 'EOF'
          {
            "experimentalFeaturesEnabled": {
              "extensibility": true
            },
            "extensions": {
              "radius": "br:biceptypes.azurecr.io/radius:latest",
              "radiusCompute": "./radiuscompute.tgz",
              "radiusData": "br:biceptypes.azurecr.io/radiusdata:latest",
              "radiusSecurity": "br:biceptypes.azurecr.io/radiussecurity:latest",
              "aws": "br:biceptypes.azurecr.io/aws:latest"
            }
          }
          EOF
          echo "bicepconfig.json created"
          cat bicepconfig.json

      - name: Create Radius environment and recipe pack
        env:
          # Registry credentials for the containerImages image push, provisioned
          # the Radius-native way: a Radius.Security/secrets resource materializes
          # them into the environment namespace where the containerImages recipe
          # reads them. Passed as secure deploy parameters so the token is never
          # written into the generated bicep (which is echoed) and is masked in logs.
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ env.RESOURCE_TYPES_CONTRIB_REPO }}"
          REF="${{ env.RESOURCE_TYPES_CONTRIB_REF }}"
          NAMESPACE="${{ vars.KUBERNETES_NAMESPACE || 'default' }}"

          # Registry and credentials for the Radius.Compute/containerImages recipe.
          # The recipe builds images with the in-pod BuildKit and pushes them to
          # $BUILD_REGISTRY, authenticating with the Kubernetes Secret named
          # $REGISTRY_SECRET_NAME. That secret is provisioned the Radius-native way
          # by the Radius.Security/secrets resource below (environment-scoped, so it
          # materializes into the environment namespace where the recipe reads it).
          # The registry path must be lowercase.
          BUILD_REGISTRY=$(echo "${{ vars.RADIUS_BUILD_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_SECRET_NAME="ghcr-registry-creds"

          # Select the provider-specific Terraform recipe pack. An AWS environment
          # registers the AWS recipe pack; an Azure environment registers the Azure
          # recipe pack. Both bundle the shared Kubernetes compute/data recipes and
          # differ only in the mySQL database recipe and cloud provider config.
          PACK_NAME="azure-terraform"
          MYSQL_RECIPE=$(cat <<EOF
          'Radius.Data/mySqlDatabases': {
            kind: 'terraform'
            source: 'git::$REPO//Data/mySqlDatabases/recipes/azure/terraform?ref=sk593/add-azure-mysql-recipe'
            parameters: {
              azure_subscription_id: '${{ vars.AZURE_SUBSCRIPTION_ID }}'
              resourceGroupName: '${{ vars.AZURE_RESOURCE_GROUP }}'
              location: '${{ vars.AZURE_LOCATION || 'eastus' }}'
            }
          }
          EOF
          )
          CLOUD_PROVIDER=$(cat <<EOF
          azure: {
            subscriptionId: '${{ vars.AZURE_SUBSCRIPTION_ID }}'
            resourceGroupName: '${{ vars.AZURE_RESOURCE_GROUP }}'
          }
          EOF
          )
          echo "Selected recipe pack: $PACK_NAME"

          # Generate a Bicep file that defines a recipe pack bundling every
          # recipe and a Radius.Core/environments resource that references it.
          cat > radius-env.bicep <<EOF
          extension radius

          @description('Registry username for containerImages image push.')
          param registryUsername string
          @secure()
          @description('Registry password/token for containerImages image push.')
          param registryPassword string

          resource recipePack 'Radius.Core/recipePacks@2025-08-01-preview' = {
            name: '$PACK_NAME'
            properties: {
              recipes: {
                'Radius.Compute/containerImages': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/containerImages/recipes/kubernetes/terraform?ref=$REF'
                  parameters: {
                    registry: '$BUILD_REGISTRY'
                    registrySecretName: '$REGISTRY_SECRET_NAME'
                  }
                }
                'Radius.Compute/containers': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/containers/recipes/kubernetes/terraform?ref=$REF'
                }
                'Radius.Compute/persistentVolumes': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/persistentVolumes/recipes/kubernetes/terraform?ref=$REF'
                }
                'Radius.Compute/routes': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/routes/recipes/kubernetes/terraform?ref=$REF'
                }
                'Radius.Data/postgreSqlDatabases': {
                  kind: 'terraform'
                  source: 'git::$REPO//Data/postgreSqlDatabases/recipes/kubernetes/terraform?ref=$REF'
                }
                'Radius.Security/secrets': {
                  kind: 'terraform'
                  source: 'git::$REPO//Security/secrets/recipes/kubernetes/terraform?ref=$REF'
                }
          $MYSQL_RECIPE
              }
            }
          }

          resource env 'Radius.Core/environments@2025-08-01-preview' = {
            name: '$ENVIRONMENT'
            properties: {
              recipePacks: [
                recipePack.id
              ]
              providers: {
                kubernetes: {
                  namespace: '$NAMESPACE'
                }
          $CLOUD_PROVIDER
              }
            }
          }

          resource ghcrCreds 'Radius.Security/secrets@2025-08-01-preview' = {
            name: '$REGISTRY_SECRET_NAME'
            properties: {
              environment: env.id
              data: {
                username: {
                  value: registryUsername
                }
                password: {
                  value: registryPassword
                }
              }
            }
          }
          EOF

          echo "Generated radius-env.bicep:"
          cat radius-env.bicep
          echo ""
          echo "Deploying Radius.Core/environments and recipe pack..."
          rad deploy radius-env.bicep \
            --parameters registryUsername="$REGISTRY_USERNAME" \
            --parameters registryPassword="$REGISTRY_PASSWORD"
          echo "✅ Environment '$ENVIRONMENT' created with recipe pack."

      - name: Verify app namespace on target cluster
        run: |
          TARGET_KUBECONFIG="$RADIUS_TARGET_KUBECONFIG"
          if [ -f "$TARGET_KUBECONFIG" ]; then
            BICEP_APP_NAME=$(grep -oP "name:\s*'\K[^']+" ".radius/app.bicep" 2>/dev/null | head -1)
            if [ -z "$BICEP_APP_NAME" ]; then
              BICEP_APP_NAME="app"
            fi
            APP_NS="default-$BICEP_APP_NAME"
            echo "Ensuring namespace $APP_NS exists on target cluster..."
            kubectl --kubeconfig "$TARGET_KUBECONFIG" get namespace "$APP_NS" 2>/dev/null ||               kubectl --kubeconfig "$TARGET_KUBECONFIG" create namespace "$APP_NS"
          fi

      - name: Run rad commands
        env:
          # Pass caller input through the environment to avoid command injection.
          # Caller-supplied rad commands. Falls back to the RADIUS_RAD_COMMANDS
          # environment variable (set by the Radius extension) so the command —
          # with non-secret application parameters inlined — applies on both an
          # explicit dispatch and the verify→deploy auto trigger (where inputs
          # are empty).
          RAD_COMMANDS: ${{ inputs.rad_commands || vars.RADIUS_RAD_COMMANDS }}
          # Application parameters (user-supplied + auto-generated by the Radius
          # extension) as a JSON object: {"password":"…","apiKey":"…"}. Consumed
          # by the default deploy below. Read via the environment (not inlined into
          # the script) so values with quotes/newlines can't break the shell.
          RADIUS_DEPLOY_PARAMS: ${{ secrets.RADIUS_DEPLOY_PARAMS }}
        run: |
          # pipefail so a failed `rad` whose output is piped through `tee` is detected
          # via PIPESTATUS rather than masked by tee's exit code.
          set -o pipefail
          mkdir -p /tmp/radius-output
          RESULT_FILE=/tmp/radius-output/rad-commands-result.json

          # Ensure the radiusCompute extension is imported for Radius.Compute/containerImages.
          # Without it, the Bicep compiler routes Radius.Compute types to Azure ARM instead of UCP.
          if ! grep -q 'extension radiusCompute' "$APP_FILE" 2>/dev/null; then
            echo "Injecting 'extension radiusCompute' into $APP_FILE"
            sed -i '/^extension radius$/a extension radiusCompute' "$APP_FILE" 2>/dev/null || true
          fi

          # Aggregate result accumulators. The result is written by a trap on EXIT so
          # the combined `rad-commands-result` artifact is complete even when a command
          # fails and the step exits early.
          COMMANDS_JSON='[]'
          OVERALL_OUTCOME="succeeded"
          OVERALL_EXIT=0
          REQUESTED=0
          RAN=0

          write_result() {
            jq -n \
              --arg outcome "$OVERALL_OUTCOME" \
              --argjson exitCode "$OVERALL_EXIT" \
              --arg environment "$ENVIRONMENT" \
              --argjson requested "$REQUESTED" \
              --argjson ran "$RAN" \
              --argjson commands "$COMMANDS_JSON" \
              '{schemaVersion:"1.0", outcome:$outcome, exitCode:$exitCode, environment:$environment, commandsRequested:$requested, commandsRan:$ran, commands:$commands}' \
              > "$RESULT_FILE"
          }
          trap write_result EXIT

          # Allowed-command set. Each command's leading verb must be in this list, so
          # commands that do not fit the ephemeral, per-run model — managing or
          # upgrading a control plane, switching workspaces, or changing install state —
          # cannot run. Validation happens before any command runs, so a disallowed
          # command fails fast (exit 2) without deploying anything.
          ALLOWED_VERBS="deploy app resource env recipe group credential resource-type version bicep"
          is_allowed() {
            local verb="${1%% *}"
            case " $ALLOWED_VERBS " in *" $verb "*) return 0 ;; *) return 1 ;; esac
          }

          # Record one command's result into the combined artifact. Keeps live console
          # output via tee while capturing it for the artifact.
          record() {
            local index="$1"; shift
            local display="$1"; shift
            local outfile code
            outfile=$(mktemp)
            echo "::group::rad $display"
            "$@" 2>&1 | tee "$outfile"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            RAN=$((RAN + 1))
            COMMANDS_JSON=$(jq \
              --argjson index "$index" \
              --arg cmd "$display" \
              --argjson code "$code" \
              --arg outcome "$([ "$code" -eq 0 ] && echo succeeded || echo failed)" \
              --rawfile out "$outfile" \
              '. + [{index:$index, command:$cmd, outcome:$outcome, exitCode:$code, output:$out}]' \
              <<<"$COMMANDS_JSON")
            rm -f "$outfile"
            return "$code"
          }

          if [ -n "${RAD_COMMANDS//[[:space:]]/}" ]; then
            # Caller-supplied commands: a single command string or a JSON array, run in
            # order with the `rad` prefix omitted.
            if printf '%s' "$RAD_COMMANDS" | jq -e 'type == "array"' >/dev/null 2>&1; then
              mapfile -t COMMANDS < <(printf '%s' "$RAD_COMMANDS" | jq -r '.[]')
            else
              COMMANDS=("$RAD_COMMANDS")
            fi

            # Drop blank entries and validate every command before running any of them.
            CLEAN=()
            for cmd in "${COMMANDS[@]}"; do
              [ -z "${cmd//[[:space:]]/}" ] && continue
              CLEAN+=("$cmd")
            done
            REQUESTED=${#CLEAN[@]}

            for cmd in "${CLEAN[@]}"; do
              if ! is_allowed "$cmd"; then
                OVERALL_OUTCOME="disallowed_command"
                OVERALL_EXIT=2
                COMMANDS_JSON=$(jq --arg cmd "$cmd" \
                  '. + [{command:$cmd, outcome:"disallowed", exitCode:2, errorMessage:"Command leading verb is not in the allowed-command set."}]' \
                  <<<"$COMMANDS_JSON")
                echo "Disallowed command: rad $cmd" >&2
                exit 2
              fi
            done

            idx=0
            for cmd in "${CLEAN[@]}"; do
              verb="${cmd%% *}"
              if [ "$verb" = "deploy" ]; then
                # For deploy commands, append the image and the secret application
                # parameters. Build an argv array so secret values with special
                # characters are never word-split, and keep them out of the
                # recorded command string (only the non-secret `$cmd` is recorded).
                # shellcheck disable=SC2086
                read -ra CMD_ARGV <<< "$cmd"
                EXTRA_PARAMS=()
                if [ -n "$APP_IMAGE" ]; then
                  EXTRA_PARAMS+=(--parameters "image=$APP_IMAGE")
                fi
                if [ -n "${RADIUS_DEPLOY_PARAMS//[[:space:]]/}" ]; then
                  while IFS= read -r _pname; do
                    [ -z "$_pname" ] && continue
                    _pval=$(printf '%s' "$RADIUS_DEPLOY_PARAMS" | jq -r --arg k "$_pname" '.[$k]')
                    EXTRA_PARAMS+=(--parameters "$_pname=$_pval")
                  done < <(printf '%s' "$RADIUS_DEPLOY_PARAMS" | jq -r 'keys_unsorted[]')
                fi
                if ! record "$idx" "$cmd" rad "${CMD_ARGV[@]}" "${EXTRA_PARAMS[@]}"; then
                  OVERALL_OUTCOME="command_failed"
                  OVERALL_EXIT=1
                  echo "Command failed: rad $cmd" >&2
                  exit 1
                fi
              else
                # Intentional word-split: the command string carries its own args.
                # shellcheck disable=SC2086
                if ! record "$idx" "$cmd" rad $cmd; then
                  OVERALL_OUTCOME="command_failed"
                  OVERALL_EXIT=1
                  echo "Command failed: rad $cmd" >&2
                  exit 1
                fi
              fi
              idx=$((idx + 1))
            done
            echo "✅ Radius commands complete."
          else
            # Default behavior: deploy the app bicep. Build the parameters as an array
            # so values with special characters are not mangled by the shell.
            REQUESTED=1
            DEPLOY_PARAMS=()
            if [ -n "$APP_IMAGE" ]; then
              DEPLOY_PARAMS+=(--parameters "image=$APP_IMAGE")
            fi
            # Expand the application parameters JSON ({"name":"value", …}) into
            # --parameters name=value pairs. Each value is read back from the JSON
            # by key with jq so embedded '=', spaces, or newlines are preserved and
            # never re-split by the shell.
            if [ -n "${RADIUS_DEPLOY_PARAMS//[[:space:]]/}" ]; then
              while IFS= read -r _pname; do
                [ -z "$_pname" ] && continue
                _pval=$(printf '%s' "$RADIUS_DEPLOY_PARAMS" | jq -r --arg k "$_pname" '.[$k]')
                DEPLOY_PARAMS+=(--parameters "$_pname=$_pval")
              done < <(printf '%s' "$RADIUS_DEPLOY_PARAMS" | jq -r 'keys_unsorted[]')
            fi
            # The recorded command string omits the parameters so secret values are
            # not written into the result artifact.
            if ! record 0 "deploy $APP_FILE --environment $ENVIRONMENT" \
                rad deploy "$APP_FILE" --environment "$ENVIRONMENT" "${DEPLOY_PARAMS[@]}"; then
              OVERALL_OUTCOME="command_failed"
              OVERALL_EXIT=1
              echo "Deployment failed" >&2
              exit 1
            fi
            echo "✅ Deployment complete."
          fi

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rad-commands-result
          path: /tmp/radius-output/
          retention-days: 1

      - name: Persist Radius state (rad shutdown)
        if: always()
        run: |
          # rad shutdown backs up the control-plane PostgreSQL databases and the
          # Terraform recipe-state Secrets to the `radius-state` git orphan branch and
          # pushes it to origin (contents: write). It runs even when a command fails so
          # a partially-applied Terraform run is not lost. It does not manage the
          # cluster; the cleanup step tears k3d down afterwards.
          git config --global user.email "radius-deploy@users.noreply.github.com"
          git config --global user.name "radius-deploy"
          rad shutdown

      - name: Show application status
        if: always()
        run: |
          rad app list || true

      - name: Collect Radius logs
        if: failure()
        run: |
          mkdir -p /tmp/radius-logs
          for deploy in applications-rp dynamic-rp bicep-de controller ucpd; do
            kubectl logs -n radius-system -l app.kubernetes.io/name=$deploy --tail=200 >> /tmp/radius-logs/$deploy.log 2>&1 || true
          done
          kubectl get pods -n radius-system -o wide >> /tmp/radius-logs/pods.txt 2>&1 || true
          kubectl get events -n radius-system --sort-by=.lastTimestamp >> /tmp/radius-logs/events.txt 2>&1 || true

          # Collect app pod logs and events from target cluster
          APP_NS="default-todo-list-app"
          TKC="$RADIUS_TARGET_KUBECONFIG"
          KC=""; [ -f "$TKC" ] && KC="--kubeconfig $TKC"
          if kubectl $KC get ns "$APP_NS" &>/dev/null; then
            kubectl $KC get pods -n "$APP_NS" -o wide >> /tmp/radius-logs/app-pods.txt 2>&1 || true
            kubectl $KC get events -n "$APP_NS" --sort-by=.lastTimestamp >> /tmp/radius-logs/app-events.txt 2>&1 || true
            for pod in $(kubectl $KC get pods -n "$APP_NS" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl $KC logs -n "$APP_NS" "$pod" --all-containers --tail=100 >> "/tmp/radius-logs/app-pod-$pod.log" 2>&1 || true
              kubectl $KC describe pod -n "$APP_NS" "$pod" >> "/tmp/radius-logs/app-describe-$pod.txt" 2>&1 || true
            done
            kubectl $KC get secret dbsecret -n "$APP_NS" -o jsonpath='{.data}' >> /tmp/radius-logs/app-dbsecret-keys.txt 2>&1 || true
          fi

      - name: Upload Radius logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radius-logs
          path: /tmp/radius-logs/
          retention-days: 3

      - name: Cleanup control plane cluster
        if: always()
        run: k3d cluster delete radius-cp || true
