# This workflow is auto-generated by Radius to run rad commands against an Azure
# environment. It is a reusable (workflow_call) workflow invoked by the unified
# run-rad-commands.yml dispatcher; it is not dispatched directly. It creates an
# ephemeral k3d cluster for the Radius control plane, connects to the user's AKS
# cluster, restores persisted state, runs the requested rad commands (deploying by
# default), then persists state again and tears the cluster down. The provider-
# agnostic phases are shared composite actions in radius-project/radius; only the
# Azure-specific steps live here. This is the run-rad-commands action in the
# two-action Repo Radius model (the other being verify-cloud-auth).
name: Radius - Run rad Commands (Azure)

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment name'
        type: string
        required: true
      image:
        description: 'Container image for the application'
        type: string
        required: false
        default: ''
      rad_commands:
        description: 'rad CLI command string, or JSON array of command strings (rad prefix omitted, run verbatim). Overrides the default deploy.'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  packages: write

env:
  ENVIRONMENT: ${{ inputs.environment }}
  APP_FILE: '{{APP_FILE}}'
  APP_IMAGE: ${{ inputs.image || github.sha || 'latest' }}
  RESOURCE_TYPES_CONTRIB_REPO: https://github.com/radius-project/resource-types-contrib.git
  RESOURCE_TYPES_CONTRIB_REF: main

jobs:
  deploy:
    name: Deploy with Radius
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get target cluster kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "RADIUS_TARGET_KUBECONFIG=$HOME/.kube/target-cluster" >> "$GITHUB_ENV"

      - name: Connect to AKS cluster
        if: ${{ vars.AZURE_AKS_CLUSTER_NAME != '' }}
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_AKS_CLUSTER_NAME }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --file "$RADIUS_TARGET_KUBECONFIG"

      - name: Set up control plane
        uses: radius-project/radius/.github/extension/actions/setup-control-plane@{{RADIUS_REF}}

      - name: Project cloud OIDC tokens into Radius pods
        run: |
          # Mint GitHub OIDC tokens and mount them where Radius expects them.
          # GitHub Actions is already a trusted OIDC issuer for both AWS and Azure
          # (via the CloudFormation template / AAD federated credential), so no
          # custom issuer setup is needed.

          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "Projecting Azure OIDC token..."
            AZ_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
            # The secret data key becomes the mounted file name, so it must be
            # 'azure-identity-token' -- the file Radius and the Terraform azurerm
            # provider read from /var/run/secrets/azure/tokens/.
            kubectl create secret generic azure-oidc-token -n radius-system \
              --from-literal=azure-identity-token="$AZ_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          fi

          # Mount the projected token at the fixed paths Radius reads from. The
          # cloud identity selectors (AWS role ARN, Azure client/tenant id) are NOT
          # set as SDK-native env vars here -- they come from the UCP credential
          # registered later via `rad credential register`. We only project the raw
          # token file that the credential needs for the federated token exchange.

          # Azure workload identity: the Go UCPCredential (applications-rp), the
          # .NET Bicep DE (bicep-de) and the Terraform azurerm provider (dynamic-rp)
          # all read /var/run/secrets/azure/tokens/azure-identity-token.
          # AZURE_FEDERATED_TOKEN_FILE is still required because armauth builds the
          # WorkloadIdentityCredential with an empty TokenFilePath and falls back to
          # this env var to locate the token.
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            AZ_PATCH='[
              {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"azure-oidc-token","secret":{"secretName":"azure-oidc-token"}}},
              {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"azure-oidc-token","mountPath":"/var/run/secrets/azure/tokens","readOnly":true}},
              {"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"AZURE_FEDERATED_TOKEN_FILE","value":"/var/run/secrets/azure/tokens/azure-identity-token"}}
            ]'
            for deploy in applications-rp dynamic-rp bicep-de; do
              kubectl patch deployment $deploy -n radius-system --type=json -p="$AZ_PATCH" 2>/dev/null || true
            done
          fi

          # Wait for any patched deployments to roll out.
          for deploy in applications-rp dynamic-rp bicep-de ucp; do
            kubectl rollout status deployment/$deploy -n radius-system --timeout=300s || true
          done
          echo "✅ Cloud OIDC tokens projected into Radius pods."

      - name: Refresh external deployment target credentials
        run: |
          TARGET_KUBECONFIG="$RADIUS_TARGET_KUBECONFIG"

          if [ ! -f "$TARGET_KUBECONFIG" ]; then
            echo "No target kubeconfig found, resources will deploy to k3d cluster"
            exit 0
          fi

          # Update the secret the chart mounted at install with the refreshed
          # kubeconfig, then restart the recipe-executing pods so they re-read it.
          # The chart owns the volume mount and RADIUS_TARGET_KUBECONFIG env var via
          # global.targetCluster.enabled, so no manual deployment patching is needed.
          # All three pods honor RADIUS_TARGET_KUBECONFIG natively: applications-rp
          # (direct-rendered resources) and dynamic-rp (Terraform kubernetes provider)
          # via the cluster access resolver, and bicep-de (Bicep 'extension kubernetes'
          # provider). The Terraform state backend deliberately stays on the
          # control-plane cluster, so no backend override is needed here.
          kubectl create secret generic target-kubeconfig --namespace radius-system \
            --from-file=kubeconfig="$TARGET_KUBECONFIG" --dry-run=client -o yaml | kubectl apply -f -
          for deploy in applications-rp dynamic-rp bicep-de; do
            kubectl rollout restart deployment/$deploy -n radius-system
          done

          echo "Waiting for rollouts..."
          kubectl rollout status deployment/applications-rp -n radius-system --timeout=300s
          kubectl rollout status deployment/dynamic-rp -n radius-system --timeout=300s
          kubectl rollout status deployment/bicep-de -n radius-system --timeout=300s
          echo "External deployment target configured."

      - name: Restore Radius state
        uses: radius-project/radius/.github/extension/actions/restore-state@{{RADIUS_REF}}
        with:
          namespace: ${{ vars.KUBERNETES_NAMESPACE || 'default' }}

      - name: Register cloud credentials with Radius
        run: |
          # Register the cloud identity with Radius using its UCP credential model.
          # Radius stores only the identity selector (AWS role ARN / Azure client +
          # tenant id); the short-lived token is read at runtime from the GitHub
          # OIDC token file projected into the pods in the earlier step. This keeps
          # the credential visible to `rad credential show`, rotatable, and usable
          # by both the Bicep and Terraform code paths.
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "Registering Azure workload identity credential..."
            rad credential register azure wi \
              --client-id "${{ vars.AZURE_CLIENT_ID }}" \
              --tenant-id "${{ vars.AZURE_TENANT_ID }}"
          fi
          echo "✅ Cloud credentials registered with Radius."

      - name: Register resource types
        uses: radius-project/radius/.github/extension/actions/register-resource-types@{{RADIUS_REF}}
        with:
          resource-types-repo: ${{ env.RESOURCE_TYPES_CONTRIB_REPO }}
          resource-types-ref: ${{ env.RESOURCE_TYPES_CONTRIB_REF }}

      - name: Create Radius environment and recipe pack
        run: |
          REPO="${{ env.RESOURCE_TYPES_CONTRIB_REPO }}"
          REF="${{ env.RESOURCE_TYPES_CONTRIB_REF }}"
          NAMESPACE="${{ vars.KUBERNETES_NAMESPACE || 'default' }}"

          # Registry and credentials for the Radius.Compute/containerImages recipe.
          # The recipe builds images with the in-pod BuildKit and pushes them to
          # $BUILD_REGISTRY, authenticating with the Kubernetes Secret named
          # $REGISTRY_SECRET_NAME. Because the recipe loads that Secret via the
          # in-cluster provider (the control-plane cluster where dynamic-rp/BuildKit
          # run), the secret is provisioned directly onto the control plane by the
          # run-and-teardown action. Only the secret NAME is wired here via the
          # recipe pack's registrySecretName. $BUILD_REGISTRY is ghcr.io/<owner>/<repo>
          # so images land under the repository's package namespace; it must be lowercase.
          BUILD_REGISTRY=$(echo "${{ vars.RADIUS_BUILD_REGISTRY || format('ghcr.io/{0}', github.repository) }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_SECRET_NAME="ghcr-registry-creds"

          # Azure recipe pack: provision the data / messaging / AI resource types
          # with Azure Verified Modules (Bicep, from mcr.microsoft.com/bicep/avm),
          # mirroring radius-project/resource-types-contrib recipepack/azure. The
          # application image is still built from the repo source by the Kubernetes
          # containerImages recipe, and the container recipe consumes that image.
          # The types the AVM pack omits (persistentVolumes, routes, secrets) stay
          # on the shared Kubernetes Terraform recipes so apps using them keep working.
          PACK_NAME="azure-avm"
          echo "Selected recipe pack: $PACK_NAME"

          # Generate a Bicep file that defines a recipe pack bundling every
          # recipe and a Radius.Core/environments resource that references it.
          cat > radius-env.bicep <<EOF
          extension radius

          resource recipePack 'Radius.Core/recipePacks@2025-08-01-preview' = {
            name: '$PACK_NAME'
            properties: {
              recipes: {
                // Build the application image from the repo source with the in-pod
                // BuildKit and push it to the build registry; the container recipe
                // below consumes the resulting image reference.
                'Radius.Compute/containerImages': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/containerImages/recipes/kubernetes/terraform?ref=$REF'
                  parameters: {
                    registry: '$BUILD_REGISTRY'
                    registrySecretName: '$REGISTRY_SECRET_NAME'
                  }
                }
                // Container recipe from the Azure recipe pack (Bicep kube-recipe).
                'Radius.Compute/containers': {
                  kind: 'bicep'
                  source: 'ghcr.io/radius-project/kube-recipes/containers:latest'
                }
                // Azure Verified Module (Bicep) recipes for the data / messaging /
                // AI resource types, copied from resource-types-contrib recipepack/azure.
                'Radius.Data/redisCaches': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/cache/redis-enterprise:0.5.1'
                  parameters: {
                    name: '{{context.resource.name}}'
                    skuName: '{{context.resource.properties.size == "S" ? "Balanced_B0" : "Balanced_B1"}}'
                    highAvailability: 'Disabled'
                    database: {
                      name: 'default'
                      accessKeysAuthentication: 'Enabled'
                    }
                    publicNetworkAccess: 'Enabled'
                    enableTelemetry: false
                  }
                  outputs: {
                    host: 'hostName'
                    port: 'port'
                    url: 'primaryConnectionString'
                  }
                }
                'Radius.AI/models': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/cognitive-services/account:0.15.0'
                  parameters: {
                    name: '{{context.resource.name}}'
                    kind: 'OpenAI'
                    sku: 'S0'
                    customSubDomainName: '{{context.resource.name}}'
                    disableLocalAuth: false
                    publicNetworkAccess: 'Enabled'
                    deployments: [
                      {
                        name: 'chat'
                        model: {
                          format: 'OpenAI'
                          name: '{{context.resource.properties.model}}'
                          version: '2025-08-07'
                        }
                        sku: {
                          name: 'GlobalStandard'
                          capacity: 1
                        }
                      }
                    ]
                    enableTelemetry: false
                  }
                  outputs: {
                    endpoint: 'endpoint'
                    apiKey: 'primaryKey'
                  }
                }
                'Radius.AI/search': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/search/search-service:0.12.2'
                  parameters: {
                    name: '{{context.resource.name}}'
                    sku: 'basic'
                    disableLocalAuth: false
                    replicaCount: 1
                    partitionCount: 1
                    enableTelemetry: false
                  }
                  outputs: {
                    endpoint: 'endpoint'
                    apiKey: 'primaryKey'
                  }
                }
                'Radius.Data/mongoDatabases': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/document-db/database-account:0.19.0'
                  parameters: {
                    name: '{{context.resource.name}}'
                    capabilitiesToAdd: [
                      'EnableMongo'
                    ]
                    mongodbDatabases: [
                      {
                        name: '{{context.resource.properties.database}}'
                      }
                    ]
                    networkRestrictions: {
                      ipRules: []
                      publicNetworkAccess: 'Enabled'
                    }
                    enableTelemetry: false
                  }
                  outputs: {
                    endpoint: 'endpoint'
                    connectionString: 'primaryReadWriteConnectionString'
                  }
                }
                'Radius.Data/mySqlDatabases': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/db-for-my-sql/flexible-server:0.10.3'
                  parameters: {
                    name: '{{context.resource.name}}'
                    administratorLogin: '{{context.resource.properties.username}}'
                    administratorLoginPassword: '{{context.resource.properties.password}}'
                    skuName: 'Standard_B1ms'
                    tier: 'Burstable'
                    version: '{{context.resource.properties.version == "5.7" ? "5.7" : "8.0.21"}}'
                    databases: [
                      {
                        name: '{{context.resource.properties.database}}'
                      }
                    ]
                    availabilityZone: -1
                    highAvailability: 'Disabled'
                    geoRedundantBackup: 'Disabled'
                    storageSizeGB: 32
                    publicNetworkAccess: 'Enabled'
                    firewallRules: [
                      {
                        name: 'allow-all'
                        startIpAddress: '0.0.0.0'
                        endIpAddress: '255.255.255.255'
                      }
                    ]
                    enableTelemetry: false
                  }
                  outputs: {
                    host: 'fqdn'
                  }
                }
                'Radius.Data/postgreSqlDatabases': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/db-for-postgre-sql/flexible-server:0.15.2'
                  parameters: {
                    name: '{{context.resource.name}}'
                    administratorLogin: '{{context.resource.properties.username}}'
                    administratorLoginPassword: '{{context.resource.properties.password}}'
                    authConfig: {
                      activeDirectoryAuth: 'Enabled'
                      passwordAuth: 'Enabled'
                    }
                    skuName: '{{context.resource.properties.size == "S" ? "Standard_B1ms" : "Standard_D2ds_v5"}}'
                    tier: '{{context.resource.properties.size == "S" ? "Burstable" : "GeneralPurpose"}}'
                    databases: [
                      {
                        name: '{{context.resource.properties.database}}'
                      }
                    ]
                    version: '16'
                    availabilityZone: -1
                    highAvailability: 'Disabled'
                    geoRedundantBackup: 'Disabled'
                    storageSizeGB: 32
                    publicNetworkAccess: 'Enabled'
                    firewallRules: [
                      {
                        name: 'allow-all'
                        startIpAddress: '0.0.0.0'
                        endIpAddress: '255.255.255.255'
                      }
                    ]
                    enableAdvancedThreatProtection: false
                    enableTelemetry: false
                  }
                  outputs: {
                    host: 'fqdn'
                  }
                }
                'Radius.Data/sqlServerDatabases': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/sql/server:0.21.4'
                  parameters: {
                    name: '{{context.resource.name}}'
                    administratorLogin: '{{context.resource.properties.username}}'
                    administratorLoginPassword: '{{context.resource.properties.password}}'
                    publicNetworkAccess: 'Enabled'
                    firewallRules: [
                      {
                        name: 'AllowAllWindowsAzureIps'
                        startIpAddress: '0.0.0.0'
                        endIpAddress: '0.0.0.0'
                      }
                    ]
                    databases: [
                      {
                        name: '{{context.resource.properties.database}}'
                        availabilityZone: -1
                        sku: {
                          name: 'Basic'
                          tier: 'Basic'
                        }
                        maxSizeBytes: 2147483648
                        zoneRedundant: false
                      }
                    ]
                    enableTelemetry: false
                  }
                  outputs: {
                    host: 'fullyQualifiedDomainName'
                  }
                }
                'Radius.Messaging/rabbitMQ': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/service-bus/namespace:0.16.2'
                  parameters: {
                    name: '{{context.resource.name}}'
                    skuObject: {
                      name: 'Standard'
                    }
                    zoneRedundant: false
                    disableLocalAuth: false
                    queues: [
                      {
                        name: '{{context.resource.properties.queue}}'
                      }
                    ]
                    enableTelemetry: false
                  }
                  outputs: {
                    host: 'name'
                    connectionString: 'primaryConnectionString'
                  }
                }
                'Radius.Messaging/kafka': {
                  kind: 'bicep'
                  source: 'mcr.microsoft.com/bicep/avm/res/event-hub/namespace:0.14.2'
                  parameters: {
                    name: '{{context.resource.name}}'
                    skuName: 'Standard'
                    skuCapacity: 1
                    disableLocalAuth: false
                    eventhubs: [
                      {
                        name: '{{context.resource.properties.topic}}'
                      }
                    ]
                    enableTelemetry: false
                  }
                  outputs: {
                    host: 'name'
                    connectionString: 'primaryConnectionString'
                  }
                }
                // Kubernetes Terraform recipes for the types the AVM pack omits.
                'Radius.Compute/persistentVolumes': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/persistentVolumes/recipes/kubernetes/terraform?ref=$REF'
                }
                'Radius.Compute/routes': {
                  kind: 'terraform'
                  source: 'git::$REPO//Compute/routes/recipes/kubernetes/terraform?ref=$REF'
                }
                'Radius.Security/secrets': {
                  kind: 'terraform'
                  source: 'git::$REPO//Security/secrets/recipes/kubernetes/terraform?ref=$REF'
                }
              }
            }
          }

          resource env 'Radius.Core/environments@2025-08-01-preview' = {
            name: '$ENVIRONMENT'
            properties: {
              recipePacks: [
                recipePack.id
              ]
              providers: {
                kubernetes: {
                  namespace: '$NAMESPACE'
                }
                azure: {
                  subscriptionId: '${{ vars.AZURE_SUBSCRIPTION_ID }}'
                  resourceGroupName: '${{ vars.AZURE_RESOURCE_GROUP }}'
                }
              }
            }
          }
          EOF

          echo "Generated radius-env.bicep:"
          cat radius-env.bicep
          echo ""
          echo "Deploying Radius.Core/environments and recipe pack..."
          rad deploy radius-env.bicep
          echo "✅ Environment '$ENVIRONMENT' created with recipe pack."

      - name: Run rad commands
        uses: radius-project/radius/.github/extension/actions/run-rad-commands@{{RADIUS_REF}}
        with:
          environment: ${{ inputs.environment }}
          app-file: ${{ env.APP_FILE }}
          app-image: ${{ env.APP_IMAGE }}
          namespace: ${{ vars.KUBERNETES_NAMESPACE || 'default' }}
          rad-commands: ${{ inputs.rad_commands || vars.RADIUS_RAD_COMMANDS }}
          deploy-params: ${{ secrets.RADIUS_DEPLOY_PARAMS }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Teardown
        if: always()
        uses: radius-project/radius/.github/extension/actions/teardown@{{RADIUS_REF}}
