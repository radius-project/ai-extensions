name: Feedback or bug report
description: Share feedback or report a bug for this repository.
title: "[Feedback/Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to share feedback or report a bug. Please
        provide enough detail for the maintainers to understand, reproduce, and
        prioritize the issue.
  - type: dropdown
    id: report-type
    attributes:
      label: What type of issue is this?
      description: Select the option that best describes what you are submitting.
      options:
        - Feedback
        - Bug report
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the feedback or bug.
      placeholder: Tell us what happened or what you would like to improve.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: For bugs, list the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: For bugs, what actually happened?
    validations:
      required: false
  - type: textarea
    id: screenshots-or-logs
    attributes:
      label: Screenshots or logs
      description: Add screenshots, logs, or error messages if they help explain the issue.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: If known, provide the package, skill, extension, commit SHA, or branch.
      placeholder: main, v0.1.0, or commit SHA
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share details such as OS, browser, Copilot app version, or runtime.
      placeholder: macOS, Windows, Linux, browser, Copilot app version, etc.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help us understand the issue.
    validations:
      required: false
