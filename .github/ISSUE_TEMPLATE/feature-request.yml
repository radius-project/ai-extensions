name: Feature request
description: Propose a new capability or an improvement to an existing one.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search
        [existing issues](https://github.com/radius-project/ai-extensions/issues?q=is%3Aissue)
        first in case someone has already proposed this.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation you run into today and why it is a problem.
        Focus on the goal rather than a specific implementation.
      placeholder: When I model an app with more than one database, I have to ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the repository would this change?
      options:
        - Radius plugin or skills
        - Radius canvas extension
        - Core packages (core, adapter-shared, adapter-canvas)
        - Build, CI, or tooling
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Sketches, sample config, or example output are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, prior art, or anything else that helps make the case.
    validations:
      required: false
