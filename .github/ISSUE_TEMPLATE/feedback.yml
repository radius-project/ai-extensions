name: Feedback
description: Share an experience report or general feedback that is not a bug or a feature request.
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Use this for experience reports, rough edges, and general impressions.
        If you have a specific bug or a concrete feature idea, please use those
        templates instead so we can triage it properly.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What worked well, what did not, and what you were trying to do at the time.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the repository is this about?
      options:
        - Radius plugin or skills
        - Radius canvas extension
        - Core packages (core, adapter-shared, adapter-canvas)
        - Build, CI, or tooling
        - Documentation
        - Not sure
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or additional context
      description: Anything that helps illustrate the feedback.
    validations:
      required: false
