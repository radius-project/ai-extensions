name: Bug report
description: Something is broken or not behaving as documented.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search
        [existing issues](https://github.com/radius-project/ai-extensions/issues?q=is%3Aissue)
        first to avoid duplicates.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug.
      placeholder: Deploying an app with a Redis dependency fails during recipe resolution.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the repository does this affect?
      options:
        - Radius plugin or skills
        - Radius canvas extension
        - Core packages (core, adapter-shared, adapter-canvas)
        - Build, CI, or tooling
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The exact steps needed to reproduce the behavior.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full error message if there is one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or stack traces
      description: |
        Paste relevant output. Logs are rendered as a code block automatically,
        so no backticks are needed.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package, plugin, or extension version, or the commit SHA or branch.
      placeholder: main, v0.1.0, or a commit SHA
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Copilot app or CLI version, and cloud provider if relevant.
      placeholder: |
        OS: macOS 15.3
        Node.js: 22.11.0
        Copilot CLI: 1.0.80
        Cloud provider: Azure
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help, such as a workaround you found.
    validations:
      required: false
