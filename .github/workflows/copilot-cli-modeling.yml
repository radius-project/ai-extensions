# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Copilot CLI Modeling
run-name: Modeling ${{ inputs.model || 'scheduled models' }} with ${{ inputs.ai-extensions-ref || github.sha }}

# Runs Copilot CLI with a built or published Radius plugin. The CLI uses the
# version and the settings of the GitHub Copilot app. Each case sends the
# dataset prompt and
# passes when the agent loads the radius-app-bicep skill and the skill
# publishes .radius/app.bicep. See scripts/copilot-cli-modeling/README.md.
#
# Daily and by hand only, never on a push or a pull request. The agent runs in
# Autopilot on third-party sample code, and every run uses Copilot requests.

on:
  # GitHub can disable scheduled workflows after 60 days without repository
  # activity. A manual dispatch or repository update re-enables the schedule.
  schedule:
    # 05:53 UTC, once daily, offset from the other scheduled workflows.
    - cron: "53 5 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Model ID for every case, such as gpt-6.1-sol. Leave blank to use each case's scheduled model.
        type: string
        default: ""
      reasoning-effort:
        description: Reasoning effort for every case.
        type: choice
        options:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        default: medium
      ai-extensions-ref:
        description: Plugin branch, commit, or published tag, such as radius@0.2.3. Blank uses this workflow's commit.
        type: string
        default: ""
      case-set:
        description: The two daily cases, or all evaluation cases copied into this checkout. Evaluation requires model.
        type: choice
        options:
          - daily
          - evaluation
        default: daily

permissions: {}

env:
  # A scheduled run has no inputs. A pinned reasoning effort keeps a change of
  # the CLI's default effort from changing the result.
  REASONING_EFFORT: ${{ inputs.reasoning-effort || 'medium' }}

jobs:
  prepare:
    name: Prepare plugin and cases
    if: github.event_name == 'workflow_dispatch' || github.repository == 'radius-project/ai-extensions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
      cases-directory: ${{ steps.cases.outputs.directory }}
      plugin-sha: ${{ steps.plugin.outputs.sha }}
    steps:
      - name: Checkout the test runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select cases
        id: cases
        env:
          MODEL: ${{ inputs.model }}
          CASE_SET: ${{ inputs.case-set || 'daily' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MODEL" && ! "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "::error::model must be a model ID, such as gpt-6.1-sol."
            exit 1
          fi
          if [[ "$CASE_SET" == daily ]]; then
            directory=scripts/copilot-cli-modeling/cases
            matrix='{"include":[{"case":"mongo-express-mongo-express","model":"gpt-6.1-sol"},{"case":"sosedoff-pgweb","model":"gpt-6-astra"}]}'
          elif [[ "$CASE_SET" == evaluation ]]; then
            if [[ -z "$MODEL" ]]; then
              echo "::error::Set model when selecting the evaluation case set."
              exit 1
            fi
            directory=scripts/copilot-cli-modeling/evaluation-cases
            matrix="$(find "$directory" -mindepth 2 -maxdepth 2 -type f -name case.yaml \
              | sort | jq -Rsc '{include: [split("\n")[] | select(length > 0) | {case: (split("/")[-2])}]}')"
            jq -e '.include | length > 0 and all(.[]; .case | test("^[a-z0-9][a-z0-9-]*$"))' <<< "$matrix"
          else
            echo "::error::Unknown case set."
            exit 1
          fi
          {
            printf 'directory=%s\n' "$directory"
            printf 'matrix=%s\n' "$matrix"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the selected plugin
        if: inputs.ai-extensions-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radius-project/ai-extensions
          ref: ${{ inputs.ai-extensions-ref }}
          path: under-test
          persist-credentials: false

      - name: Identify plugin layout
        id: plugin
        env:
          PLUGIN_REF: ${{ inputs.ai-extensions-ref }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir=.
          if [[ -n "$PLUGIN_REF" ]]; then
            source_dir=under-test
          fi
          {
            printf 'source=%s\n' "$source_dir"
            printf 'sha=%s\n' "$(git -C "$source_dir" rev-parse HEAD)"
            if [[ -f "$source_dir/package.json" ]]; then
              printf 'packaged=false\npath=%s/.artifacts/radius\n' "$source_dir"
            elif [[ -f "$source_dir/plugins/radius/plugin.json" ]]; then
              printf 'packaged=true\npath=%s/plugins/radius\n' "$source_dir"
            else
              echo "::error::The selected ref contains neither plugin source nor a published Radius package." >&2
              exit 1
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.plugin.outputs.packaged == 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ steps.plugin.outputs.source }}/package.json

      - name: Setup Node.js
        if: steps.plugin.outputs.packaged == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.plugin.outputs.source }}/.node-version
          package-manager-cache: false

      - name: Install dependencies
        if: steps.plugin.outputs.packaged == 'false'
        working-directory: ${{ steps.plugin.outputs.source }}
        run: pnpm install --frozen-lockfile

      - name: Build the Radius plugin
        if: steps.plugin.outputs.packaged == 'false'
        working-directory: ${{ steps.plugin.outputs.source }}
        run: pnpm build

      - name: Package the selected plugin
        env:
          PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
          PLUGIN_SHA: ${{ steps.plugin.outputs.sha }}
          CASE_SET: ${{ inputs.case-set || 'daily' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.name == "radius"' "$PLUGIN_DIR/plugin.json"
          tar -czf "$RUNNER_TEMP/radius-plugin.tgz" -C "$PLUGIN_DIR" .
          printf 'Plugin commit: %s\n\nCase set: %s\n' \
            "$PLUGIN_SHA" "$CASE_SET" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the selected plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-plugin
          path: ${{ runner.temp }}/radius-plugin.tgz
          if-no-files-found: error
          retention-days: 14

  model:
    name: Model ${{ matrix.case }} with ${{ inputs.model || matrix.model }}
    needs: prepare
    # Scheduled workflows keep running in forks that enable Actions. Those
    # runs would use the fork owner's Copilot requests.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'radius-project/ai-extensions'
    runs-on: ubuntu-24.04
    # Longer than the step timeouts below, so the output upload still runs
    # after a step times out.
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout
      # Lets Copilot CLI send Copilot requests with the workflow's token. The
      # organization pays for the requests.
      copilot-requests: write
    env:
      # A pinned model per case keeps a change of the CLI's default model from
      # changing the result.
      MODEL: ${{ inputs.model || matrix.model }}
    strategy:
      # Each case is its own result. One failure must not cancel the other.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache. The agent runs sample code with every
          # permission, and other workflows restore the same cache.
          package-manager-cache: false

      - name: Download the selected plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radius-plugin
          path: ${{ runner.temp }}/plugin-artifact

      - name: Extract the selected plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radius-plugin"
          tar -xzf "$RUNNER_TEMP/plugin-artifact/radius-plugin.tgz" -C "$RUNNER_TEMP/radius-plugin"

      - name: Install Copilot CLI
        # npm retries failed downloads. A stalled registry fails here, not at
        # the job timeout.
        timeout-minutes: 5
        env:
          # The CLI version that GitHub Copilot app 1.1.30 bundles. See "Update
          # the Copilot CLI" in the README.
          CLI_PACKAGE: "@github/copilot@1.0.99-2"
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "$CLI_PACKAGE"
          copilot --version

      - name: Model the sample with Copilot CLI
        # Longer than the harness's 35-minute run limit, so the harness stops
        # the session first and writes its summary.
        timeout-minutes: 45
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          CASE: ${{ matrix.case }}
          CASES_DIRECTORY: ${{ needs.prepare.outputs.cases-directory }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/copilot-cli-modeling/run-modeling.mjs \
            --case "$CASES_DIRECTORY/$CASE/case.yaml" \
            --plugin-dir "$RUNNER_TEMP/radius-plugin" \
            --work-dir "$RUNNER_TEMP/copilot-cli-work" \
            --output-dir "$RUNNER_TEMP/copilot-cli-output" \
            --model "$MODEL" \
            --reasoning-effort "$REASONING_EFFORT"

      - name: Record comparison inputs
        if: always()
        env:
          PLUGIN_SHA: ${{ needs.prepare.outputs.plugin-sha }}
          CASE_SET: ${{ inputs.case-set || 'daily' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copilot-cli-output"
          jq -n --arg pluginCommit "$PLUGIN_SHA" --arg caseSet "$CASE_SET" \
            --arg runnerCommit "$GITHUB_SHA" --arg model "$MODEL" \
            --arg reasoningEffort "$REASONING_EFFORT" \
            '{pluginCommit: $pluginCommit, caseSet: $caseSet, runnerCommit: $runnerCommit, model: $model, reasoningEffort: $reasoningEffort}' \
            > "$RUNNER_TEMP/copilot-cli-output/comparison.json"

      - name: Upload the run output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-cli-modeling-${{ matrix.case }}
          path: ${{ runner.temp }}/copilot-cli-output
          if-no-files-found: warn
          retention-days: 14

  notify-scheduled-result:
    name: Scheduled modeling alert
    # An overnight failure that nobody sees is the same as no test at all.
    if: ${{ always() && github.event_name == 'schedule' && github.repository == 'radius-project/ai-extensions' }}
    needs:
      - model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report or clear scheduled failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: model=${{ needs.model.result }}
          SCHEDULE_FAILED: ${{ needs.model.result != 'success' }}
        shell: bash
        run: |
          title="Copilot CLI Modeling scheduled failure"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$SCHEDULE_FAILED" == "true" ]]; then
            body="The scheduled Copilot CLI Modeling workflow failed: $RESULT. Run: $run_url. Each case uploads summary.md and logs as an artifact. See scripts/copilot-cli-modeling/README.md."
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label test-failure
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "The scheduled Copilot CLI Modeling workflow recovered. Run: $run_url"
          fi
