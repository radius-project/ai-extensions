# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Canvas Visual Baselines Commit

# Commits the baselines that the Canvas Visual Baselines workflow regenerated
# for a labeled pull request, then reports the result on the pull request.
#
# `workflow_run` always runs this file from the default branch, and every
# script it executes comes from that trusted checkout, so pull request code
# never runs next to the GitHub App token. The regenerated PNGs are the only
# pull request input; they arrive as an artifact of an unprivileged run and are
# validated before anything is written. Nothing here restores or saves a cache,
# so the default branch's cache scope cannot be poisoned from this run.
# The trusted-consumer pattern above is the safe use of workflow_run: no pull
# request code is checked out or executed, and its artifact is validated.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Canvas Visual Baselines
    types:
      - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  LABEL: pr:update-visual-baselines
  RENDER_JOB: Regenerate baselines

jobs:
  commit:
    name: Commit baselines
    # Branches in forks cannot be pushed to; the triggering workflow already
    # explains the local command for them.
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # the triggering run's jobs and artifact
      contents: read # the trusted default-branch checkout
      pull-requests: write # the status comment and label removal
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Every labeled event starts a run, but only the requested label runs the
      # render job. Re-reading the pull request also confirms the label is
      # still present and the head has not moved since it was rendered.
      - name: Resolve the labeled pull request
        id: pr
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          render="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" |
              jq -r --arg name "$RENDER_JOB" \
                '[.jobs[] | select(.name == $name) | .conclusion][0] // "skipped"'
          )"
          if [[ "$render" == "skipped" ]]; then
            echo "The triggering run did not regenerate baselines."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The triggering run is not associated with a pull request."
            exit 1
          fi

          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          if ! jq -e --arg label "$LABEL" 'any(.labels[]; .name == $label)' <<< "$pull" >/dev/null; then
            echo "The $LABEL label is no longer on #$PR; nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(jq -r .state <<< "$pull")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pull")"
          head_ref="$(jq -r .head.ref <<< "$pull")"
          head_sha="$(jq -r .head.sha <<< "$pull")"
          # Release branches are published artifacts, never pull request work.
          if [[ "$state" != "open" || "$head_repo" != "$GITHUB_REPOSITORY" || "$head_ref" == "$DEFAULT_BRANCH" || "$head_ref" == releases/* || "$head_ref" == changeset-release/* ]]; then
            echo "::error::#$PR is not an open pull request from a feature branch of this repository."
            exit 1
          fi

          outcome=""
          if [[ "$CONCLUSION" != "success" || "$render" != "success" ]]; then
            outcome=update-failed
          elif [[ "$head_sha" != "$HEAD_SHA" ]]; then
            echo "::warning::#$PR moved from $HEAD_SHA to $head_sha after it was rendered."
            outcome=update-failed
          fi
          {
            echo "proceed=true"
            echo "number=$PR"
            echo "ref=$head_ref"
            echo "outcome=$outcome"
          } >> "$GITHUB_OUTPUT"

      - name: Find regenerated baselines
        id: artifact
        if: ${{ steps.pr.outputs.proceed == 'true' && steps.pr.outputs.outcome == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=canvas-visual-baselines" --jq .total_count)"
          if [[ "$count" -gt 0 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download regenerated baselines
        id: download
        if: ${{ steps.artifact.outputs.present == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canvas-visual-baselines
          path: ${{ runner.temp }}/canvas-visual-baselines
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate and stage regenerated baselines
        id: apply
        if: ${{ steps.artifact.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(node scripts/canvas-visual-baselines.mjs apply "$RUNNER_TEMP/canvas-visual-baselines")"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "files<<$delimiter"
            echo "$files"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        if: ${{ steps.apply.outcome == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_MANAGER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_MANAGER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ai-extensions
          permission-contents: write

      # The Git Data API creates a commit that GitHub signs for the App, and a
      # push by the App, unlike one by GITHUB_TOKEN, re-runs pull request checks.
      # The ref moves only from the rendered head, so a newer push is kept.
      - name: Commit to the pull request branch
        id: push
        if: ${{ steps.app-token.outcome == 'success' }}
        env:
          BRANCH: ${{ steps.pr.outputs.ref }}
          FILES: ${{ steps.apply.outputs.files }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PARENT: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then
              paths+=(--path "$file")
            fi
          done <<< "$FILES"
          message="test(canvas): update visual baselines

          Regenerated by the $LABEL label on #$PR.

          Signed-off-by: radius-release-manager[bot] <323233809+radius-release-manager[bot]@users.noreply.github.com>"
          created="$(
            node scripts/verified-git.mjs commit \
              --parent "$PARENT" \
              --message "$message" \
              "${paths[@]}"
          )"
          commit="$(jq -r .commit <<< "$created")"
          tree="$(jq -r .tree <<< "$created")"
          parent_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PARENT" --jq .tree.sha)"
          if [[ "$tree" == "$parent_tree" ]]; then
            echo "The regenerated baselines already match #$PR's head."
            exit 0
          fi
          node scripts/verified-git.mjs ref \
            --name "refs/heads/$BRANCH" \
            --sha "$commit" \
            --fast-forward-from "$PARENT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Update pull request status comment
        if: ${{ always() && steps.pr.outputs.proceed == 'true' }}
        env:
          APPLY: ${{ steps.apply.outcome }}
          COMMIT: ${{ steps.push.outputs.commit }}
          DOWNLOAD: ${{ steps.download.outcome }}
          FIND: ${{ steps.artifact.outcome }}
          FILES: ${{ steps.apply.outputs.files }}
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.pr.outputs.outcome }}
          PR: ${{ steps.pr.outputs.number }}
          PRESENT: ${{ steps.artifact.outputs.present }}
          PUSH: ${{ steps.push.outcome }}
          RENDER_URL: ${{ github.event.workflow_run.html_url }}
          TOKEN: ${{ steps.app-token.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          args=()
          if [[ -n "$OUTCOME" ]]; then
            state="$OUTCOME"
            run_url="$RENDER_URL"
          elif [[ "$FIND" != "success" ]]; then
            state=update-failed
          elif [[ "$PRESENT" != "true" ]]; then
            state=unchanged
            run_url="$RENDER_URL"
          elif [[ "$DOWNLOAD" != "success" || "$APPLY" != "success" || "$TOKEN" != "success" || "$PUSH" != "success" ]]; then
            state=update-failed
          elif [[ -z "$COMMIT" ]]; then
            state=unchanged
          else
            state=updated
            args+=(--commit "$COMMIT")
            while IFS= read -r file; do
              if [[ -n "$file" ]]; then
                args+=(--file "$file")
              fi
            done <<< "$FILES"
          fi
          node scripts/canvas-visual-baselines.mjs comment \
            --pr "$PR" \
            --state "$state" \
            --run-url "$run_url" \
            "${args[@]}"

      # Removing the label lets the author add it again after another change.
      - name: Remove the update label
        if: ${{ always() && steps.pr.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$LABEL" >/dev/null; then
            echo "::warning::Could not remove the $LABEL label. Remove it before adding it again."
          fi
