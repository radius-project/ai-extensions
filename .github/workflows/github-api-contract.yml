# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: GitHub API contracts

on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-api-contract-sandbox
  cancel-in-progress: false

jobs:
  contracts:
    if: >-
      github.repository == 'radius-project/ai-extensions' &&
      (github.event_name == 'workflow_dispatch' || vars.GITHUB_CONTRACT_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITHUB_CONTRACT_REPOSITORY: ${{ vars.GITHUB_CONTRACT_REPOSITORY }}
      GITHUB_CONTRACT_ALLOWLIST: ${{ vars.GITHUB_CONTRACT_ALLOWLIST }}
      GITHUB_CONTRACT_APP_LOGIN: ${{ vars.GITHUB_CONTRACT_APP_LOGIN }}
      AIEXT_CLOUD_E2E_FIXTURE_REPOSITORY: ${{ vars.AIEXT_CLOUD_E2E_FIXTURE_REPOSITORY }}
    steps:
      - name: Validate explicit sandbox configuration
        id: sandbox
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.GITHUB_CONTRACT_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GITHUB_CONTRACT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_CONTRACT_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ "${GITHUB_CONTRACT_REPOSITORY,,}" != "${GITHUB_CONTRACT_ALLOWLIST,,}" ]] ||
             [[ "${GITHUB_CONTRACT_REPOSITORY,,}" == "radius-project/ai-extensions" ]] ||
             [[ "${GITHUB_CONTRACT_REPOSITORY,,}" == "${AIEXT_CLOUD_E2E_FIXTURE_REPOSITORY,,}" ]]; then
            echo "::error::Configure a separate, explicitly allowlisted GitHub contract sandbox."
            exit 1
          fi
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" || -z "$GITHUB_CONTRACT_APP_LOGIN" ]]; then
            echo "::error::Configure GITHUB_CONTRACT_APP_CLIENT_ID, GITHUB_CONTRACT_APP_PRIVATE_KEY, and GITHUB_CONTRACT_APP_LOGIN."
            exit 1
          fi
          {
            echo "owner=${GITHUB_CONTRACT_REPOSITORY%%/*}"
            echo "name=${GITHUB_CONTRACT_REPOSITORY##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create setup and branch-rules token
        id: setup
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GITHUB_CONTRACT_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUB_CONTRACT_APP_PRIVATE_KEY }}
          owner: ${{ steps.sandbox.outputs.owner }}
          repositories: ${{ steps.sandbox.outputs.name }}
          permission-administration: write
          permission-actions: read
          permission-contents: write
          permission-workflows: write

      - name: Create metadata-only masked-environment token
        id: masked
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GITHUB_CONTRACT_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUB_CONTRACT_APP_PRIVATE_KEY }}
          owner: ${{ steps.sandbox.outputs.owner }}
          repositories: ${{ steps.sandbox.outputs.name }}
          permission-metadata: read

      - name: Create token without workflows or Actions write
        id: restricted
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GITHUB_CONTRACT_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUB_CONTRACT_APP_PRIVATE_KEY }}
          owner: ${{ steps.sandbox.outputs.owner }}
          repositories: ${{ steps.sandbox.outputs.name }}
          permission-contents: write
          permission-actions: read

      - name: Run real GitHub contracts
        env:
          RUN_LIVE_GITHUB_API_TESTS: "1"
          GITHUB_CONTRACT_SETUP_TOKEN: ${{ steps.setup.outputs.token }}
          GITHUB_CONTRACT_MASKED_TOKEN: ${{ steps.masked.outputs.token }}
          GITHUB_CONTRACT_RESTRICTED_TOKEN: ${{ steps.restricted.outputs.token }}
        run: pnpm run test:github-contract
