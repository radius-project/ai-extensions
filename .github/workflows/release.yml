# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release

# Cuts a versioned, immutable release of the radius plugin in two phases. The
# `main` ruleset requires a reviewed pull request, a verified signature, a DCO
# check and linear history, and grants GitHub Actions no bypass — so CI can never
# push the version bump to main directly.
#
#   1. prepare  (manual dispatch; pick the semver bump level)
#      Bumps the version in every tracked manifest on a `release/v<version>`
#      branch and opens a pull request. A human reviews and squash-merges it;
#      GitHub creates and signs the squash commit, satisfying the ruleset.
#
#   2. check + publish  (push to main)
#      When main carries a version that has no tag yet, the bundle is built and
#      attested, then published as:
#
#        release branch  = the merged main tree + one commit adding the bundle
#        v<version> tag  = immutable annotated tag on that commit
#        GitHub release  = generated notes + the bundle as an attested asset
#
#      Every other push to main resolves to an already-released version and stops
#      after the cheap `check` job.
#
# `release` is the only moving pointer (the plugin `source` in
# .github/plugin/marketplace.json pins `ref: release`); version tags are pushed
# without --force, so a re-run fails instead of overwriting a released version.
#
# publish builds the pushed commit itself — the same ref and SHA the provenance
# attestation records — so the attestation always describes the revision that was
# actually built.
#
# See RELEASING.md and docs/architecture/plugin-packaging-and-publishing.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver level to bump for this release
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    branches: [main]

permissions: {}

env:
  BUNDLE: plugins/radius/extension.mjs

jobs:
  prepare:
    name: Open the version bump pull request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release/v<version> branch
      pull-requests: write # open the version bump pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always prepare from main, whichever ref the run was dispatched from,
          # so the pull request bumps the version main actually carries.
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Resolve release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="$(node scripts/version.mjs --check)"
          next="$(node scripts/version.mjs --bump "$BUMP" --dry-run)"
          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "Preparing $current -> $next ($BUMP)" >>"$GITHUB_STEP_SUMMARY"

      - name: Verify the version tag is unused
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Released versions are immutable - pick a different bump level."
            exit 1
          fi

      - name: Bump version in manifests
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/version.mjs --bump "$BUMP"

      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          branch="release/v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add plugins/radius/plugin.json plugins/radius/package.json .github/plugin/marketplace.json
          # -s adds the Signed-off-by trailer the DCO status check requires.
          git commit -s -m "chore(release): v$VERSION"
          git push --force origin "$branch"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing pull request #$existing." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body="Bumps the plugin version to v$VERSION."
          body="$body Merging this pull request publishes the release: the canvas bundle is built and"
          body="$body attested, the release branch is force-updated, and the immutable v$VERSION tag and"
          body="$body GitHub release are created."

          gh pr create --base main --head "$branch" \
            --title "chore(release): v$VERSION" \
            --body "$body"

  check:
    name: Check for an unreleased version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Resolve the manifest version
        id: resolve
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs --check)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "v$version is already released - nothing to publish." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "v$version is not released yet - publishing." >>"$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Build, attest and publish
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-update release, push the tag and the GitHub release
      id-token: write # OIDC token used to sign the build provenance
      attestations: write # record the provenance attestation for the bundle
    # Releases mutate shared refs; never run two at once, and never cancel one
    # mid-publish.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No explicit ref: build the pushed commit, which is exactly the ref and
          # SHA the provenance attestation records.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version bump pull request is opened with GITHUB_TOKEN, so it never
      # triggers build.yml. These gates are what stand between a bad merge and a
      # published release.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify the bundle was produced
        run: |
          set -euo pipefail
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Expected build artifact $BUNDLE was not produced."
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.BUNDLE }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # release = the merged main tree + one commit force-adding the ignored
          # bundle. The branch carries no ruleset, so CI may write to it.
          git checkout -B release
          git add -f "$BUNDLE"
          git commit -m "chore(release): canvas bundle for v$VERSION"
          git push --force origin release

          # Immutable annotated tag - pushed without --force so a pre-existing tag
          # fails the push instead of being overwritten.
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "$BUNDLE"
