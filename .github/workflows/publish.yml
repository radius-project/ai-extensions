# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish

# Publishes the radius plugin to a generated `releases/edge` branch so installs
# get the whole plugin — skills, plugin.json, and the compiled canvas bundle —
# without committing the git-ignored build output to main.
#
# The build itself is not repeated here: this reuses build.yml (same checks,
# same artifact) and downloads its `plugin-dist` output. On every push to main
# it force-recreates `releases/edge` as an ORPHAN branch holding only that
# directory plus the marketplace catalog — one root commit, no source, no
# history — then moves the `edge` tag onto it.
#
# The catalog ships on both refs: on `releases/edge` so
# `marketplace add OWNER/REPO#releases/edge` is self-consistent, and on main
# (synced by the last step) because a plain `marketplace add OWNER/REPO` clones
# the default branch. Both advertise the version that was just published.
#
# See docs/design/2026-07-canvas-bundle-publishing.md for the full design.

on:
  push:
    branches: [main]
    # The last step pushes a marketplace.json-only commit back to main; ignoring
    # that path stops it from re-triggering this workflow.
    paths-ignore:
      - .github/plugin/marketplace.json
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish to edge
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only one publish may run at a time; a newer run supersedes an in-flight
    # one so `releases/edge` always reflects the most recent main it observed.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      DIST: plugins/radius/dist
      MANIFEST: .github/plugin/marketplace.json
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download plugin dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plugin-dist
          path: plugins/radius/dist

      - name: Publish plugin dist to releases/edge branch and edge tag
        run: |
          set -euo pipefail

          for f in "$DIST/plugin.json" "$DIST/extension.mjs" "$DIST/extension.mjs.map"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected build artifact $f was missing from plugin-dist."
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ship the catalog alongside the plugin so `marketplace add
          # OWNER/REPO#releases/edge` advertises exactly what is published here.
          node -e '
            const fs = require("node:fs");
            const file = process.env.MANIFEST;
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const plugin = manifest.plugins.find((p) => p.name === "radius");
            if (!plugin) {
              console.error("No radius plugin entry in " + file);
              process.exit(1);
            }
            plugin.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

          # releases/edge is an ORPHAN branch carrying only the built plugin and
          # its catalog: no source, no history, one root commit per publish.
          # --orphan starts an unborn branch with the old tree still staged, so
          # clear the index and re-add just what ships. The source commit it was
          # built from is recorded in the commit message.
          git branch -D releases/edge 2>/dev/null || true
          git checkout --orphan releases/edge
          git rm -rfq --cached .
          git add -f "$DIST" "$MANIFEST"
          git commit -m "chore(release): publish ${VERSION} for ${GITHUB_SHA}"

          unexpected="$(git ls-tree -r --name-only HEAD | grep -v "^$DIST/" | grep -vFx "$MANIFEST" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::releases/edge must contain only $DIST and $MANIFEST; found:"
            echo "$unexpected"
            exit 1
          fi

          git push --force origin releases/edge
          # Tag the commit just published so `edge` always resolves to the
          # current releases/edge head.
          git tag -f edge releases/edge
          git push --force origin edge
