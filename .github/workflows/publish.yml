# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish

# Publishes every plugin in this monorepo to its own generated
# `releases/<plugin>/edge` branch so installs get the whole plugin — skills,
# plugin.json, and the compiled canvas bundle — without committing the
# git-ignored build output to main.
#
# The plugin list comes from `scripts/plugins.mjs`, which discovers every
# directory under `plugins/`, so adding a plugin needs no change here. Each one
# builds and publishes as an independent matrix leg.
#
# The build itself is not repeated: this reuses build.yml (same checks, same
# artifact) and downloads its `plugin-dist-<plugin>` output. On every push to
# main it force-recreates the channel branch as an ORPHAN holding only that
# plugin's dist plus the marketplace catalog — one root commit, no source, no
# history — then moves the branch and `<plugin>@edge` tag onto it. A stale
# manual rerun is skipped when a newer main commit is already published.
#
# Before the first push the bundle gets signed build provenance and an SBOM
# attestation. build.yml produced both the dist and its native `pnpm sbom`
# document from one workspace, so the inventory names the stamped edge version
# actually being published. Edge publishes a branch rather than a release and
# so has nowhere to attach the document; the attestation is where it lives.
#
# That commit and tag ref are created through the GitHub API as the automation
# GitHub App. GitHub signs the commit; the lightweight tag is created only after
# the API confirms its target commit is Verified. Nothing is committed or
# tagged on the runner, which has no signing key.
#
# Every published ref is namespaced by plugin name — `releases/<plugin>/<channel>`
# and `<plugin>@<channel>` — so plugins never collide.
#
# The catalog ships alongside the plugin on `releases/<plugin>/edge` so
# `marketplace add OWNER/REPO#releases/<plugin>/edge` advertises exactly what is
# published there. Nothing is pushed back to main: the main ruleset grants
# GitHub Actions no bypass, so this workflow only writes refs that carry no
# rules.
#
# This is the rolling prerelease channel. Immutable, versioned releases are cut
# on demand by release.yml.
#
# See docs/design/2026-07-canvas-bundle-publishing.md for the full design.

on:
  push:
    branches: [main]

permissions: {}

# Queue complete runs, including their builds, in arrival order. The
# full-workflow queue preserves normal push order; the publish-time ancestry
# check also rejects an older run that is manually rerun later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  plugins:
    name: Resolve the plugin list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry uses only Node built-ins, so the runner's own Node is
      # enough and this stays well ahead of the build matrix.
      - name: List the plugins
        id: list
        run: |
          set -euo pipefail
          names="$(node scripts/plugins.mjs --json)"
          echo "names=$names" >>"$GITHUB_OUTPUT"

  build:
    needs: plugins
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      channel: edge
      plugins: ${{ needs.plugins.outputs.names }}
      ref: ${{ github.sha }}

  publish:
    name: Publish ${{ matrix.plugin }} to edge
    needs: [plugins, build]
    if: always() && needs.plugins.result == 'success'
    strategy:
      # Each plugin owns distinct refs and artifacts, so one failure must not
      # cancel or serialize the rest.
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.names) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # the app token writes the channel branch and tag
      id-token: write # OIDC token used to sign the build provenance
      attestations: write # record the provenance attestation for the bundle
      artifact-metadata: write # link attested subjects to artifact records
    env:
      MANIFEST: .github/plugin/marketplace.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The reusable workflow uploads this only after every shared test and
      # static gate passes. A failed sibling plugin does not remove it.
      - name: Download shared release gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-gate
          path: ${{ runner.temp }}/build-gate

      - name: Resolve the plugin refs
        run: |
          node scripts/plugins.mjs \
            --env "${{ matrix.plugin }}" --channel edge >>"$GITHUB_ENV"

      - name: Download plugin dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLUGIN_ARTIFACT }}
          path: ${{ env.PLUGIN_DIST }}

      # Built alongside the dist by the same build job, so it inventories the
      # exact bundle published below, stamped edge version included.
      - name: Download plugin SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLUGIN_SBOM_ARTIFACT }}
          path: ${{ runner.temp }}/sbom

      # The version is read back out of the artifact: a matrixed build job has
      # no per-leg outputs addressable from here, and the artifact is the thing
      # actually being published.
      - name: Verify the build artifacts are present
        run: |
          set -euo pipefail
          version="$(jq -er .version "$PLUGIN_DIST/package.json")"
          node scripts/validate-plugin-dist.mjs \
            --plugin "$PLUGIN_NAME" --version "$version"
          echo "VERSION=$version" >>"$GITHUB_ENV"

      # build.yml ran in this same workflow run, so the provenance this records
      # describes the run that actually produced the bundle. Attesting before
      # the first push means a failure never leaves an unattested publish.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PLUGIN_DIST }}/**/*

      # Edge publishes a branch rather than a release, so it has nowhere to
      # attach an SBOM file. Recording it against the same subjects as the
      # provenance is what makes the inventory retrievable: `gh attestation
      # verify` on any published file returns the bundle it came from.
      - name: Attest the plugin SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PLUGIN_DIST }}/**/*
          sbom-path: ${{ runner.temp }}/sbom/${{ env.PLUGIN_SBOM }}

      # The app creates the signed commit and its lightweight tag ref through
      # the GitHub API; the runner holds no signing key.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_MANAGER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_MANAGER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ai-extensions
          permission-contents: write

      - name: Publish plugin dist to the edge branch and tag
        env:
          # gh reads GH_TOKEN first, so the read-only workflow token still
          # serves the gh and git calls below; only the app token writes refs.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          gh auth setup-git

          # A manually rerun workflow keeps its original GITHUB_SHA and may run
          # after newer pushes have already published. Permit same-source retries
          # and forward progress, but never roll the channel back or cross a
          # rewritten/divergent main history.
          if git ls-remote --exit-code --heads origin "refs/heads/$PLUGIN_CHANNEL_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "+refs/heads/$PLUGIN_CHANNEL_BRANCH:refs/remotes/origin/$PLUGIN_CHANNEL_BRANCH"

            # Everything below trusts the published commit, including the skip
            # that reports success, so only an artifact this app actually signed
            # may stop this run. A rolling branch is force-recreated anyway, so
            # anything else is re-baselined rather than treated as fatal.
            current_commit="$(git rev-parse "refs/remotes/origin/$PLUGIN_CHANNEL_BRANCH")"
            verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$current_commit" \
              --jq '.commit.verification.verified' 2>/dev/null || echo false)"
            parents="$(git rev-list --parents -n 1 "$current_commit" | awk '{ print NF }')"
            if [ "$verified" != "true" ] || [ "$parents" -ne 1 ]; then
              echo "::notice::$PLUGIN_CHANNEL_BRANCH holds $current_commit, which is not a verified orphan artifact; re-baselining it on $GITHUB_SHA."
              trusted=0
            else
              trusted=1
            fi
          else
            trusted=0
          fi

          if [ "$trusted" = 1 ]; then
            current_message="$(git log -1 --format=%s "refs/remotes/origin/$PLUGIN_CHANNEL_BRANCH")"
            if [[ "$current_message" != *" for "* ]]; then
              echo "::error::$PLUGIN_CHANNEL_BRANCH does not record its source commit: $current_message"
              exit 1
            fi
            current_source="${current_message##* for }"
            if [[ ! "$current_source" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$PLUGIN_CHANNEL_BRANCH records an invalid source commit: $current_source"
              exit 1
            fi

            # Rewriting main orphans the commit edge was published from, leaving
            # a well-formed SHA that no longer exists here. Ancestry is then
            # unknowable and every later push would wedge, so re-baseline the
            # channel only when this run is main's current tip and therefore
            # cannot be a stale rerun.
            if ! git cat-file -e "$current_source^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
              if [ "$GITHUB_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]; then
                echo "::error::Published edge source $current_source is no longer in main's history, and $GITHUB_SHA is not main's current tip. Re-run Publish for the newest commit on main to re-baseline $PLUGIN_CHANNEL_BRANCH."
                exit 1
              fi
              echo "::notice::Published edge source $current_source is no longer in main's history; re-baselining $PLUGIN_CHANNEL_BRANCH on $GITHUB_SHA."
            elif [ "$current_source" != "$GITHUB_SHA" ]; then
              if git merge-base --is-ancestor "$current_source" "$GITHUB_SHA"; then
                : # This run moves edge forward.
              elif git merge-base --is-ancestor "$GITHUB_SHA" "$current_source"; then
                echo "::notice::$PLUGIN_CHANNEL_BRANCH already publishes newer source $current_source; skipping stale rerun for $GITHUB_SHA."
                echo "Skipped stale edge rerun for \`$GITHUB_SHA\`; \`$PLUGIN_CHANNEL_BRANCH\` already publishes \`$current_source\`." >>"$GITHUB_STEP_SUMMARY"
                exit 0
              else
                echo "::error::Published edge source $current_source and candidate $GITHUB_SHA have divergent histories."
                exit 1
              fi
            fi
          fi

          # Ship the catalog alongside the plugin so `marketplace add
          # OWNER/REPO#releases/<plugin>/edge` advertises exactly what is
          # published here. This also rewrites the source manifests, which are
          # never among the published paths below.
          node scripts/version.mjs \
            --set "$VERSION" --plugin "$PLUGIN_NAME" --channel edge

          # The channel branch is an ORPHAN carrying only the built plugin and
          # its catalog: no source, no history, one root commit per publish.
          # Naming the two paths explicitly is what keeps anything else out of
          # the published tree, and the API refuses to move on unless GitHub
          # signed the commit and wrote it without parents. The source commit it
          # was built from is recorded in the commit message.
          commit="$(node scripts/verified-git.mjs commit \
            --message "chore(release): publish ${PLUGIN_NAME}@${VERSION} for ${GITHUB_SHA}" \
            --path "$PLUGIN_DIST" --path "$MANIFEST" | jq -r .commit)"

          # Both names resolve to that one verified commit. They can no longer
          # move in a single atomic push, so the branch every install reads
          # lands first and the next run reconciles a failure in between.
          node scripts/verified-git.mjs ref \
            --name "refs/heads/$PLUGIN_CHANNEL_BRANCH" --sha "$commit" --force
          node scripts/verified-git.mjs tag \
            --name "$PLUGIN_CHANNEL_TAG" \
            --target "$commit" --force
