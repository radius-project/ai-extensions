# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish plugin

# Publishes the radius plugin to a generated `release` branch so installs get
# the whole plugin — skills, plugin.json, and the compiled canvas bundle
# (plugins/radius/extension.mjs) — without committing the git-ignored bundle to
# main. On every push to main (i.e. after a PR merges) this rebuilds the bundle
# from the merged source and force-recreates `release` to equal the main tree
# plus one commit that force-adds the bundle, then moves the `latest` tag.
# Because `release` is the main tree plus that single commit, the latest skills
# and manifest travel with it automatically. The plugin `source` in
# .github/plugin/marketplace.json pins `ref: release`, so installs resolve the
# skills and a matching canvas from that branch.
#
# See docs/design/2026-07-canvas-bundle-publishing.md for the full design.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Only one publish may run at a time; a newer run supersedes an in-flight one so
# `release` always reflects the most recent main it observed.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish bundle to release branch and latest tag
        env:
          BUNDLE: plugins/radius/extension.mjs
        run: |
          set -euo pipefail

          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Expected build artifact $BUNDLE was not produced."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # release = current main commit + one commit that force-adds the
          # git-ignored bundle. Recreate the branch each run so it never drifts.
          git checkout -B release
          git add -f "$BUNDLE"
          git commit -m "chore(release): publish canvas bundle for ${GITHUB_SHA}"

          git push --force origin release
          git tag -f latest
          git push --force origin latest
