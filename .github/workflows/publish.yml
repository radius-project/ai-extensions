# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish plugin

# Publishes the radius plugin to a generated `releases/edge` branch so installs
# get the whole plugin — skills, plugin.json, and the compiled canvas bundle —
# without committing the git-ignored build output to main. On every push to main
# (i.e. after a PR merges) this rebuilds `plugins/radius/dist` from the merged
# source and force-recreates `releases/edge` to equal the main tree plus one
# commit that force-adds that directory, then moves the `edge` tag.
# .github/plugin/marketplace.json pins `path: plugins/radius/dist` and
# `ref: releases/edge`, so installs resolve the skills and a matching canvas
# from that branch.
#
# See docs/design/2026-07-canvas-bundle-publishing.md for the full design.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Only one publish may run at a time; a newer run supersedes an in-flight one so
# `releases/edge` always reflects the most recent main it observed.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to releases/edge branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish plugin dist to releases/edge branch and edge tag
        env:
          DIST: plugins/radius/dist
        run: |
          set -euo pipefail

          for f in "$DIST/plugin.json" "$DIST/extension.mjs" "$DIST/extension.mjs.map"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected build artifact $f was not produced."
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # releases/edge = current main commit + one commit that force-adds the
          # git-ignored dist/. Recreate the branch each run so it never drifts.
          git checkout -B releases/edge
          git add -f "$DIST"
          git commit -m "chore(release): publish plugin dist for ${GITHUB_SHA}"

          git push --force origin releases/edge
          git tag -f edge
          git push --force origin edge
