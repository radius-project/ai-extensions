# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Cloud E2E Cleanup

# Reclaims what a crashed Cloud E2E run leaks. `dispose()` runs from an
# `always()` teardown, so this workflow exists for the case where the runner
# dies outright and no teardown ever runs at all.
#
# SCOPE, and the boundary matters:
#
#   In scope   Leaked resource groups, Entra service principals and
#              applications, stale GitHub Environments, fallback pull requests
#              and branches, and resetting the fixture default branch to the
#              baseline.
#
# Resource groups are deliberately reclaimed here, not left to the shared Radius
# purge job. The Radius purge job still matches `^radtest-` older than six
# hours, so the per-run `radtest-canvas-<uid>` group remains inside its safety
# net if this workflow cannot run, but this job owns the test leak first.
#
# Resource groups are deleted as soon as this workflow sees the fixture prefix
# and tag, because those identify the groups the tests created. Other leaked
# state still waits for the age threshold. The shared concurrency group with
# cloud-e2e.yml is what prevents either path from racing a run that is still
# using its own state.
#
# See docs/eng/CLOUD_E2E_RUNBOOK.md. Like cloud-e2e.yml, this has never
# executed. The fixture repository and source pin now exist, but the
# wellknown-published CI identity and variables are still prerequisites.

on:
  # Never `pull_request_target`, and never any pull-request trigger at all.
  # This workflow deletes things; nothing a contributor can trigger should
  # reach it.
  schedule:
    # 02:07 and 14:07 UTC. Twice daily, matching the six-hour age threshold's
    # cadence, and offset from the 04:23 Cloud E2E run.
    - cron: "7 2,14 * * *"
  workflow_dispatch:

permissions: {}

# Shared with cloud-e2e.yml on purpose: a purge must never run while a journey
# is in flight, or it would delete the Entra application, Environment, or branch
# state that run is actively asserting on. `cancel-in-progress: false` so a
# queued purge waits for the run rather than displacing it. `queue: max` keeps
# that pending purge ahead of a later Cloud E2E run.
concurrency:
  group: cloud-e2e-shared-cloud-estate
  cancel-in-progress: false
  queue: max

jobs:
  purge:
    name: Reclaim leaked cloud and GitHub state
    # A fork that enables scheduled workflows would otherwise point a deletion
    # job at our subscription and our fixture repository.
    if: github.repository == 'radius-project/ai-extensions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # gh run view for CI-owned resource-group terminal checks
      contents: read # actions/checkout
      id-token: write # OIDC token exchanged for an Azure token by azure/login
    env:
      # Matches the safety-net Radius purge threshold, and is comfortably longer
      # than the 90-minute ceiling a Cloud E2E run can occupy.
      MAX_AGE_HOURS: "6"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The pin is read from the suite's own source rather than restated here.
      # A second copy of a reset target is exactly the kind of drift that turns
      # a cleanup job into a destructive operation against the wrong scope.
      # Node 24 strips the types natively, so this needs no build and no
      # dependency install.
      - name: Resolve the pinned fixture repository
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const pin = await import(
              "./packages/adapter-canvas/test/e2e-cloud/support/fixture-repository.ts"
            );
            const provisioned = pin.isFixtureRepositoryProvisioned();
            const lines = [
              `provisioned=${provisioned}`,
              `repository=${pin.FIXTURE_REPOSITORY}`,
              `owner=${pin.FIXTURE_REPO_OWNER}`,
              `name=${pin.FIXTURE_REPO_NAME}`,
              `default-branch=${pin.FIXTURE_REPO_DEFAULT_BRANCH}`,
              `baseline-sha=${pin.FIXTURE_BASELINE_SHA}`,
              `application-name=${pin.appRegistrationName()}`,
              `resource-group-prefix=${pin.RESOURCE_GROUP_PREFIX}`,
              `environment-prefix=${pin.ENVIRONMENT_NAME_PREFIX}`,
              `fixture-application=${pin.FIXTURE_APPLICATION_NAME}`,
              `workflow-fallback-branch-prefix=${pin.WORKFLOW_FALLBACK_BRANCH_PREFIX}`,
              `lease-ref=${pin.CLOUD_E2E_LEASE_REF}`,
              `reason=${pin.describeUnprovisionedFixtureRepository()}`
            ];
            await import("node:fs").then(({ appendFileSync }) =>
              appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`)
            );
          '

      # A published variable that disagrees with the pinned constant means the
      # runs and this purge are looking at two different repositories. Deleting
      # against the wrong scope is the failure this check exists to prevent, so
      # it fails the job rather than guessing which one is right.
      - name: Verify the published variable matches the pin
        id: verify-scope
        env:
          PUBLISHED: ${{ vars.AIEXT_CLOUD_E2E_FIXTURE_REPOSITORY }}
          PINNED: ${{ steps.pin.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLISHED:-}" ]]; then
            echo "configured=false" >>"$GITHUB_OUTPUT"
            echo "::notice::AIEXT_CLOUD_E2E_FIXTURE_REPOSITORY is not published yet. Cleanup will not touch Azure or GitHub."
            exit 0
          fi
          if [[ "$PUBLISHED" != "$PINNED" ]]; then
            echo "::error::AIEXT_CLOUD_E2E_FIXTURE_REPOSITORY is \"$PUBLISHED\" but the suite is pinned to \"$PINNED\". Refusing to purge against an ambiguous scope."
            exit 1
          fi
          echo "configured=true" >>"$GITHUB_OUTPUT"

      - name: Report that there is nothing to reclaim
        if: steps.pin.outputs.provisioned != 'true' || steps.verify-scope.outputs.configured != 'true'
        env:
          REASON: ${{ steps.pin.outputs.reason }}
        shell: bash
        run: |
          echo "::notice::$REASON Nothing to purge."
          echo "$REASON" >>"$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure
        if: steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true'
        id: azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create a GitHub App token for the fixture repository
        id: app-token
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLOUD_E2E_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLOUD_E2E_BOT_PRIVATE_KEY }}
          owner: ${{ steps.pin.outputs.owner }}
          repositories: ${{ steps.pin.outputs.name }}
          permission-actions: write
          permission-contents: write
          # Deleting a deployment record is a write. The records are linked to
          # their environment by name, so deleting the environment strands them
          # rather than removing them, and nothing else ever will.
          permission-deployments: write
          permission-environments: write
          permission-pull-requests: write

      - name: Delete stale Radius applications before recovery state
        id: radius-app-cleanup
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIXTURE_APPLICATION: ${{ steps.pin.outputs.fixture-application }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          DEFAULT_BRANCH: ${{ steps.pin.outputs.default-branch }}
          ENVIRONMENT_PREFIX: ${{ steps.pin.outputs.environment-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          environments="$RUNNER_TEMP/radius-cleanup-environments.json"
          expired_environments="$RUNNER_TEMP/radius-cleanup-expired-environments.json"
          gh api --paginate --slurp "repos/$FIXTURE_REPOSITORY/environments" >"$environments"

          node --input-type=module - \
            "$environments" "$ENVIRONMENT_PREFIX" "$cutoff" "$expired_environments" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [environmentsFile, prefix, cutoff, outputFile] = process.argv.slice(2);
          const { selectExpiredEnvironments } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const environments = JSON.parse(await readFile(environmentsFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(selectExpiredEnvironments(environments, prefix, cutoff))
          );
          NODE

          deleted=0
          failures=()
          while read -r environment; do
            [[ -n "$environment" ]] || continue
            before="$RUNNER_TEMP/delete-runs-before-$environment.json"
            after="$RUNNER_TEMP/delete-runs-after-$environment.json"
            gh run list \
              --repo "$FIXTURE_REPOSITORY" \
              --workflow delete-application.yml \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId >"$before"
            if ! gh workflow run delete-application.yml \
                --repo "$FIXTURE_REPOSITORY" \
                --ref "$DEFAULT_BRANCH" \
                -f "environment=$environment" \
                -f "application=$FIXTURE_APPLICATION"; then
              failures+=("dispatch Radius application delete for $environment")
              continue
            fi

            run_id=""
            for _ in {1..24}; do
              gh run list \
                --repo "$FIXTURE_REPOSITORY" \
                --workflow delete-application.yml \
                --event workflow_dispatch \
                --limit 100 \
                --json databaseId >"$after"
              run_id="$(
                node --input-type=module - "$before" "$after" <<'NODE'
                import { readFile } from "node:fs/promises";
                const [beforeFile, afterFile] = process.argv.slice(2);
                const { findNewWorkflowRunId, readWorkflowRunIds } = await import(
                  "./packages/adapter-canvas/test/e2e-cloud/support/deploy-journey.ts"
                );
                const [before, after] = await Promise.all(
                  [beforeFile, afterFile].map(async (file) =>
                    readWorkflowRunIds(JSON.parse(await readFile(file, "utf8")))
                  )
                );
                process.stdout.write(findNewWorkflowRunId(before, after) ?? "");
          NODE
              )"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            if [[ -z "$run_id" ]]; then
              failures+=("identify Radius application delete run for $environment")
              continue
            fi
            if ! gh run watch "$run_id" \
                --repo "$FIXTURE_REPOSITORY" \
                --exit-status \
                --interval 10; then
              failures+=("Radius application delete run $run_id for $environment")
              continue
            fi
            deleted=$((deleted + 1))
          done < <(jq -r '.[]' "$expired_environments")

          echo "- Radius applications deleted: $deleted" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Radius application cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # Older revisions created per-run resource groups carrying both the
      # fixture prefix and a fixture-owned tag. Retain their bounded cleanup,
      # but never target the configured shared cluster resource group.
      #
      # This runs after the Radius deletion above, not before it. A legacy group
      # can still hold the AKS cluster an older environment deploys to, and
      # deleting it first makes `delete-application.yml` fail while fetching
      # cluster credentials - which would then block every recovery-state step
      # gated on that dispatch succeeding.
      - name: Purge legacy Azure resource groups created by the suite
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.azure-login.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_GROUP_PREFIX: ${{ steps.pin.outputs.resource-group-prefix }}
          SHARED_RESOURCE_GROUP: ${{ vars.AIEXT_CLOUD_E2E_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          groups="$RUNNER_TEMP/resource-groups.json"
          test_groups="$RUNNER_TEMP/test-resource-groups.json"

          az group list \
            --subscription "$SUBSCRIPTION_ID" \
            --query "[?starts_with(name, '$RESOURCE_GROUP_PREFIX')].{name:name,tags:tags}" \
            -o json >"$groups"

          node --input-type=module - \
            "$groups" "$RESOURCE_GROUP_PREFIX" "$SHARED_RESOURCE_GROUP" "$test_groups" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [groupsFile, prefix, sharedResourceGroup, testGroupsFile] = process.argv.slice(2);
          const { selectTestResourceGroups } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const groups = JSON.parse(await readFile(groupsFile, "utf8"));
          await writeFile(
            testGroupsFile,
            JSON.stringify(
              selectTestResourceGroups(groups, prefix, sharedResourceGroup)
            )
          );
          NODE

          purged=0
          failures=()
          while IFS=$'\t' read -r name run_id; do
            [[ -n "$name" && -n "$run_id" ]] || continue
            if ! status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"; then
              echo "::warning::Could not verify whether workflow run $run_id for resource group $name is terminal; leaving it alone."
              failures+=("verify run $run_id for $name")
              continue
            fi
            if [[ "$status" != "completed" ]]; then
              echo "Leaving resource group $name because workflow run $run_id is $status."
              continue
            fi
            echo "Deleting test-created resource group $name from completed workflow run $run_id."
            if ! az group delete \
                --name "$name" \
                --subscription "$SUBSCRIPTION_ID" \
                --yes \
                --no-wait \
                --output none; then
              failures+=("delete resource group $name")
              continue
            fi
            purged=$((purged + 1))
          done < <(jq -r '.[] | [.name, .runId] | @tsv' "$test_groups")

          echo "- Azure resource groups purged: $purged" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Resource-group cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi
      # The package credential is deliberately separate from the installation
      # token. cloud-e2e.yml mints its journey token without permission inputs,
      # so it inherits the App's whole installation grant - granting the App
      # Packages write here would hand package-write to the journey token too.
      - name: Purge stale GHCR deployment state
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_RAD_CI_BOT_PAT }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          FIXTURE_OWNER: ${{ steps.pin.outputs.owner }}
          ENVIRONMENT_PREFIX: ${{ steps.pin.outputs.environment-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          environments="$RUNNER_TEMP/state-cleanup-environments.json"
          expired_environments="$RUNNER_TEMP/state-cleanup-expired-environments.json"
          gh api --paginate --slurp "repos/$FIXTURE_REPOSITORY/environments" >"$environments"

          node --input-type=module - \
            "$environments" "$ENVIRONMENT_PREFIX" "$cutoff" "$expired_environments" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [environmentsFile, prefix, cutoff, outputFile] = process.argv.slice(2);
          const { selectExpiredEnvironments } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const environments = JSON.parse(await readFile(environmentsFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(selectExpiredEnvironments(environments, prefix, cutoff))
          );
          NODE

          deleted=0
          failures=()
          while read -r environment; do
            [[ -n "$environment" ]] || continue
            package_name="$(
              FIXTURE_REPOSITORY="$FIXTURE_REPOSITORY" ENVIRONMENT="$environment" \
                node --input-type=module -e '
                  const { stateRegistryForEnvironment } = await import(
                    "./packages/core/src/workflows/state.ts"
                  );
                  const registry = stateRegistryForEnvironment(
                    process.env.FIXTURE_REPOSITORY,
                    process.env.ENVIRONMENT
                  );
                  process.stdout.write(registry.split("/").at(-1));
                '
            )"
            package_path="orgs/$FIXTURE_OWNER/packages/container/$package_name"
            package="$RUNNER_TEMP/state-package-$environment.json"
            if ! GH_TOKEN="$GH_PACKAGES_TOKEN" gh api "$package_path" >"$package" 2>"$package.stderr"; then
              if grep -q "HTTP 404" "$package.stderr"; then
                continue
              fi
              failures+=("inspect GHCR package $package_name for $environment")
              continue
            fi
            visibility="$(jq -r '.visibility // ""' "$package")"
            linked_repository="$(jq -r '.repository.full_name // ""' "$package")"
            if [[ "$visibility" != "private" && "$visibility" != "internal" ]]; then
              failures+=("refuse GHCR package $package_name with visibility ${visibility:-unknown}")
              continue
            fi
            if [[ "${linked_repository,,}" != "${FIXTURE_REPOSITORY,,}" ]]; then
              failures+=("refuse GHCR package $package_name linked to ${linked_repository:-no repository}")
              continue
            fi
            if ! GH_TOKEN="$GH_PACKAGES_TOKEN" gh api --method DELETE "$package_path"; then
              failures+=("delete GHCR package $package_name for $environment")
              continue
            fi
            deleted=$((deleted + 1))
          done < <(jq -r '.[]' "$expired_environments")

          echo "- GHCR state packages deleted: $deleted" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'GHCR state cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # The step above can only reach a package it can name, and it names them
      # by walking the fixture's environments. Once an environment is deleted -
      # by the step below, by the suite's own teardown, or by hand - the twelve
      # hex characters the package name ends in are unrecoverable, so the
      # package becomes permanently invisible to every environment-driven sweep.
      #
      # This lists the organisation's packages instead and reclaims every one
      # the fixture wrote. Cleanup exists to return the fixture to a pristine
      # baseline and no run shares it, so there is no live state to preserve;
      # the age threshold is only here so a sweep cannot delete state out from
      # under a run that is still going.
      #
      # It is deliberately not gated on the Radius application delete
      # succeeding, because that delete failing is one of the ways state is
      # orphaned in the first place.
      - name: Purge orphaned GHCR deployment state
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_RAD_CI_BOT_PAT }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          FIXTURE_OWNER: ${{ steps.pin.outputs.owner }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          packages="$RUNNER_TEMP/orphan-state-packages.json"
          orphans="$RUNNER_TEMP/orphan-state-orphans.json"

          # Matches the package name the deploy workflow writes for this
          # repository, whose shape the selector below re-checks in full.
          repository_name="${FIXTURE_REPOSITORY##*/}"
          package_prefix="${repository_name,,}-radius-state-"
          GH_TOKEN="$GH_PACKAGES_TOKEN" gh api --paginate --slurp \
            "orgs/$FIXTURE_OWNER/packages?package_type=container" >"$packages"

          node --input-type=module - \
            "$packages" "$package_prefix" "$cutoff" "$orphans" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [packagesFile, prefix, cutoff, outputFile] = process.argv.slice(2);
          const { selectStaleStatePackages } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const packages = JSON.parse(await readFile(packagesFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(selectStaleStatePackages(packages, prefix, cutoff))
          );
          NODE

          deleted=0
          failures=()
          while read -r package_name; do
            [[ -n "$package_name" ]] || continue
            package_path="orgs/$FIXTURE_OWNER/packages/container/$package_name"
            package="$RUNNER_TEMP/orphan-state-$package_name.json"
            if ! GH_TOKEN="$GH_PACKAGES_TOKEN" gh api "$package_path" >"$package" 2>"$package.stderr"; then
              if grep -q "HTTP 404" "$package.stderr"; then
                continue
              fi
              failures+=("inspect orphaned GHCR package $package_name")
              continue
            fi
            visibility="$(jq -r '.visibility // ""' "$package")"
            linked_repository="$(jq -r '.repository.full_name // ""' "$package")"
            if [[ "$visibility" != "private" && "$visibility" != "internal" ]]; then
              failures+=("refuse GHCR package $package_name with visibility ${visibility:-unknown}")
              continue
            fi
            if [[ "${linked_repository,,}" != "${FIXTURE_REPOSITORY,,}" ]]; then
              failures+=("refuse GHCR package $package_name linked to ${linked_repository:-no repository}")
              continue
            fi
            if ! GH_TOKEN="$GH_PACKAGES_TOKEN" gh api --method DELETE "$package_path"; then
              failures+=("delete orphaned GHCR package $package_name")
              continue
            fi
            deleted=$((deleted + 1))
          done < <(jq -r '.[]' "$orphans")

          echo "- Orphaned GHCR state packages deleted: $deleted" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Orphaned GHCR state cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # Deleting the Radius application is what removes the workloads it
      # rendered, and when that fails nothing else looks at the cluster at all.
      # A leaked workload then survives indefinitely, and because a later run
      # renders the same application into the same namespace under the same
      # name, it rolls the leaked object rather than creating its own - so one
      # leak quietly absorbs every subsequent run instead of being noticed.
      #
      # Objects are claimed by identity rather than by whether their
      # environment still exists: the fixture's environment prefix plus its
      # exact application label. Nothing else on this cluster carries both, and
      # no run shares the fixture, so every match is ours to reclaim. Age is
      # the only thing protecting a run in flight, and a reused object keeps
      # the creation timestamp of the run that first rendered it, so a leak
      # stays reclaimable however often it is rolled.
      #
      # This is not gated on the Radius application delete succeeding, because
      # that failing is precisely what strands a workload here.
      - name: Reclaim leaked Radius workloads from the shared cluster
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.azure-login.outcome == 'success'
        env:
          AKS_CLUSTER_NAME: ${{ vars.AIEXT_CLOUD_E2E_AKS_CLUSTER_NAME }}
          ENVIRONMENT_PREFIX: ${{ steps.pin.outputs.environment-prefix }}
          FIXTURE_APPLICATION: ${{ steps.pin.outputs.fixture-application }}
          RESOURCE_GROUP: ${{ vars.AIEXT_CLOUD_E2E_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          objects="$RUNNER_TEMP/cluster-cleanup-objects.json"
          leaked="$RUNNER_TEMP/cluster-cleanup-leaked.json"

          az aks get-credentials \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing \
            --only-show-errors
          kubectl get \
            deployments,statefulsets,daemonsets,services,horizontalpodautoscalers \
            --all-namespaces \
            --selector radapp.io/environment \
            --output json >"$objects"

          node --input-type=module - \
            "$objects" "$ENVIRONMENT_PREFIX" "$FIXTURE_APPLICATION" "$cutoff" "$leaked" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [objectsFile, prefix, application, cutoff, outputFile] =
            process.argv.slice(2);
          const { selectLeakedClusterWorkloads } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const objects = JSON.parse(await readFile(objectsFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(
              selectLeakedClusterWorkloads(objects, prefix, application, cutoff)
            )
          );
          NODE

          deleted=0
          failures=()
          while IFS=$'\t' read -r kind name namespace environment; do
            [[ -n "$kind" ]] || continue
            if ! kubectl delete "${kind,,}/$name" \
                --namespace "$namespace" \
                --ignore-not-found; then
              failures+=("delete $kind $namespace/$name leaked by $environment")
              continue
            fi
            deleted=$((deleted + 1))
          done < <(jq -r '.[] | [.kind, .name, .namespace, .environment] | @tsv' "$leaked")

          echo "- Leaked cluster workloads reclaimed: $deleted" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Cluster workload cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # A recipe provisions real Azure resources - the suite's Postgres becomes
      # a flexible server - into whichever resource group the environment
      # names. A per-run `radtest-*` group is reclaimed by deleting the group,
      # but this one holds the cluster and must survive, so its contents
      # outlive their run instead. Radius tags none of them, so there is no
      # identity to match on; what makes them reclaimable is that this group
      # exists only to run this suite.
      #
      # Age is not consulted, for the same reason the per-run groups are
      # deleted on sight: the shared concurrency group means this never runs
      # beside a journey, so anything here belongs to one that has finished.
      # The cluster itself is refused, and the selector refuses the whole group
      # if the configured cluster is not in it.
      - name: Reclaim Azure resources left in the shared resource group
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.azure-login.outcome == 'success'
        env:
          AKS_CLUSTER_NAME: ${{ vars.AIEXT_CLOUD_E2E_AKS_CLUSTER_NAME }}
          RESOURCE_GROUP: ${{ vars.AIEXT_CLOUD_E2E_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          resources="$RUNNER_TEMP/group-cleanup-resources.json"
          reclaimable="$RUNNER_TEMP/group-cleanup-reclaimable.json"

          az resource list \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            --output json >"$resources"

          node --input-type=module - \
            "$resources" "$AKS_CLUSTER_NAME" "$reclaimable" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [resourcesFile, clusterName, outputFile] = process.argv.slice(2);
          const { selectReclaimableGroupResources } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const resources = JSON.parse(await readFile(resourcesFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(
              selectReclaimableGroupResources(resources, clusterName)
            )
          );
          NODE

          deleted=0
          failures=()
          while IFS=$'\t' read -r id name type; do
            [[ -n "$id" ]] || continue
            if ! az resource delete --ids "$id" --only-show-errors; then
              failures+=("delete $type $name")
              continue
            fi
            deleted=$((deleted + 1))
          done < <(jq -r '.[] | [.id, .name, .type] | @tsv' "$reclaimable")

          echo "- Azure resources reclaimed from $RESOURCE_GROUP: $deleted" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Shared resource group cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # Both object types are matched by the exact display name the product
      # derives from the fixture repository, never by prefix. Service principals
      # go first because deleting an application can leave an orphaned principal
      # that still fails the next clean-slate probe.
      - name: Purge leaked Entra service principals and applications
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.azure-login.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success'
        env:
          APPLICATION_NAME: ${{ steps.pin.outputs.application-name }}
          AKS_CLUSTER_NAME: ${{ vars.AIEXT_CLOUD_E2E_AKS_CLUSTER_NAME }}
          ENVIRONMENT_PREFIX: ${{ steps.pin.outputs.environment-prefix }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          RESOURCE_GROUP: ${{ vars.AIEXT_CLOUD_E2E_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          principals="$RUNNER_TEMP/service-principals.json"
          applications="$RUNNER_TEMP/applications.json"
          expired_principals="$RUNNER_TEMP/expired-service-principals.json"
          expired_applications="$RUNNER_TEMP/expired-applications.json"
          unprocessed_app_ids="$RUNNER_TEMP/unprocessed-application-ids.txt"

          # Graph returns service-principal creation time only when selected.
          # Without it, fail-closed age selection would safely but permanently
          # leave every orphaned principal behind.
          az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/servicePrincipals?\$filter=displayName eq '$APPLICATION_NAME'&\$select=id,appId,displayName,createdDateTime" \
            --query value \
            -o json >"$principals"
          az ad app list \
            --filter "displayName eq '$APPLICATION_NAME'" \
            --query '[].{id:id,appId:appId,displayName:displayName,createdDateTime:createdDateTime,tags:tags}' \
            -o json >"$applications"

          node --input-type=module - \
            "$principals" "$applications" "$cutoff" "$APPLICATION_NAME" "$FIXTURE_REPOSITORY" "$ENVIRONMENT_PREFIX" \
            "$expired_principals" "$expired_applications" "$unprocessed_app_ids" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [principalsFile, applicationsFile, cutoff, displayName, repository, environmentPrefix, expiredPrincipalsFile, expiredApplicationsFile, unprocessedAppIdsFile] =
            process.argv.slice(2);
          const { selectAppIdsWithUnprocessedServicePrincipals, selectExpiredApplications, selectExpiredServicePrincipals } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const [principals, applications] = await Promise.all(
            [principalsFile, applicationsFile].map(async (file) =>
              JSON.parse(await readFile(file, "utf8"))
            )
          );
          const expiredApplications = selectExpiredApplications(
            applications,
            displayName,
            repository,
            environmentPrefix,
            cutoff
          );
          const expiredPrincipals = selectExpiredServicePrincipals(
            principals,
            displayName,
            expiredApplications.map((application) => application.appId),
            cutoff
          );
          const unprocessedAppIds = selectAppIdsWithUnprocessedServicePrincipals(
            principals,
            displayName,
            expiredApplications.map((application) => application.appId),
            expiredPrincipals
          );
          await Promise.all([
            writeFile(expiredPrincipalsFile, JSON.stringify(expiredPrincipals)),
            writeFile(expiredApplicationsFile, JSON.stringify(expiredApplications)),
            writeFile(unprocessedAppIdsFile, unprocessedAppIds.join("\n"))
          ]);
          NODE

          principals_purged=0
          assignments_purged=0
          failures=()
          blocked_app_ids="$RUNNER_TEMP/blocked-application-ids.txt"
          # Deleting an application cascade-deletes its service principal, so an
          # application whose principal was never a deletion candidate starts
          # blocked rather than being silently taken with it.
          grep -v '^$' "$unprocessed_app_ids" >"$blocked_app_ids" || : >"$blocked_app_ids"
          while read -r unprocessed_app_id; do
            [[ -n "$unprocessed_app_id" ]] || continue
            failures+=("preserve appId $unprocessed_app_id because a matching service principal was not a deletion candidate")
          done <"$blocked_app_ids"
          while IFS=$'\t' read -r id app_id; do
            [[ -n "$id" && -n "$app_id" ]] || continue
            resource_group_scope="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP"
            cluster_scope="$resource_group_scope/providers/Microsoft.ContainerService/managedClusters/$AKS_CLUSTER_NAME"
            resource_group_assignments="$RUNNER_TEMP/resource-group-role-assignments-$id.json"
            cluster_assignments="$RUNNER_TEMP/cluster-role-assignments-$id.json"
            assignments="$RUNNER_TEMP/role-assignments-$id.json"
            selected_assignments="$RUNNER_TEMP/selected-role-assignments-$id.json"

            if ! az role assignment list \
                --scope "$resource_group_scope" \
                --query '[].{id:id,principalId:principalId,roleDefinitionName:roleDefinitionName,scope:scope}' \
                -o json >"$resource_group_assignments" ||
              ! az role assignment list \
                --scope "$cluster_scope" \
                --query '[].{id:id,principalId:principalId,roleDefinitionName:roleDefinitionName,scope:scope}' \
                -o json >"$cluster_assignments"; then
              failures+=("list role assignments for service principal $id")
              echo "$app_id" >>"$blocked_app_ids"
              continue
            fi
            jq -s 'add' "$resource_group_assignments" "$cluster_assignments" >"$assignments"
            if ! node --input-type=module - \
                "$assignments" "$id" "$resource_group_scope" "$cluster_scope" "$selected_assignments" <<'NODE'
            import { readFile, writeFile } from "node:fs/promises";
            const [assignmentsFile, principalId, resourceGroupScope, clusterScope, selectedFile] =
              process.argv.slice(2);
            const { selectExpectedRoleAssignments } = await import(
              "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
            );
            const assignments = JSON.parse(await readFile(assignmentsFile, "utf8"));
            const selected = selectExpectedRoleAssignments(assignments, principalId, [
              { roleDefinitionName: "Contributor", scope: resourceGroupScope },
              { roleDefinitionName: "Locks Contributor", scope: resourceGroupScope },
              {
                roleDefinitionName: "Azure Kubernetes Service RBAC Cluster Admin",
                scope: clusterScope
              }
            ]);
            await writeFile(selectedFile, JSON.stringify(selected));
          NODE
            then
              failures+=("validate role assignments for service principal $id")
              echo "$app_id" >>"$blocked_app_ids"
              continue
            fi

            assignment_failure=0
            while read -r assignment_id; do
              [[ -n "$assignment_id" ]] || continue
              if ! az role assignment delete --ids "$assignment_id" --output none; then
                failures+=("delete role assignment $assignment_id")
                assignment_failure=1
                continue
              fi
              assignments_purged=$((assignments_purged + 1))
            done < <(jq -r '.[].id' "$selected_assignments")
            if (( assignment_failure != 0 )); then
              echo "$app_id" >>"$blocked_app_ids"
              continue
            fi
            echo "Deleting leaked service principal $APPLICATION_NAME ($id), created before $cutoff."
            if ! az ad sp delete --id "$id"; then
              failures+=("delete service principal $id")
              echo "$app_id" >>"$blocked_app_ids"
              continue
            fi
            principals_purged=$((principals_purged + 1))
          done < <(jq -r '.[] | [.id, .appId] | @tsv' "$expired_principals")

          applications_purged=0
          while IFS=$'\t' read -r id app_id; do
            [[ -n "$id" && -n "$app_id" ]] || continue
            if grep -Fxq "$app_id" "$blocked_app_ids"; then
              failures+=("preserve application $id because service principal cleanup for appId $app_id failed")
              continue
            fi
            echo "Deleting leaked application $APPLICATION_NAME ($id), created before $cutoff."
            if ! az ad app delete --id "$id"; then
              failures+=("delete application $id")
              continue
            fi
            applications_purged=$((applications_purged + 1))
          done < <(jq -r '.[] | [.id, .appId] | @tsv' "$expired_applications")

          echo "- Entra service principals purged: $principals_purged" >>"$GITHUB_STEP_SUMMARY"
          echo "- Azure role assignments purged: $assignments_purged" >>"$GITHUB_STEP_SUMMARY"
          echo "- Entra applications purged: $applications_purged" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Entra cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # A deployment record survives the environment it names, because the two
      # are linked by name rather than by id. The extension never deletes one
      # -- to the product it is history, not a resource -- so these accumulate
      # on the fixture until the suite that created them removes them. Purge
      # them before the environments so a failure here cannot orphan a record
      # whose environment has already gone.
      - name: Purge stale GitHub deployment records
        id: deployment-records-cleanup
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          ENVIRONMENT_PREFIX: ${{ steps.pin.outputs.environment-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          deployments="$RUNNER_TEMP/deployments.json"
          expired_deployments="$RUNNER_TEMP/expired-deployments.json"
          gh api --paginate --slurp "repos/$FIXTURE_REPOSITORY/deployments?per_page=100" >"$deployments"

          node --input-type=module - \
            "$deployments" "$ENVIRONMENT_PREFIX" "$cutoff" "$expired_deployments" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [deploymentsFile, prefix, cutoff, outputFile] = process.argv.slice(2);
          const { selectExpiredDeployments } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const deployments = JSON.parse(await readFile(deploymentsFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(selectExpiredDeployments(deployments, prefix, cutoff))
          );
          NODE

          purged=0
          failures=()
          while read -r id; do
            [[ -n "$id" ]] || continue
            echo "Deleting stale deployment record $id, created before $cutoff."
            # GitHub refuses to delete a deployment that is still active, and a
            # record whose job never reported a status is active by default.
            if ! gh api --method POST \
                "repos/$FIXTURE_REPOSITORY/deployments/$id/statuses" \
                -f state=inactive >/dev/null; then
              failures+=("deactivate deployment $id")
              continue
            fi
            if ! gh api --method DELETE "repos/$FIXTURE_REPOSITORY/deployments/$id"; then
              failures+=("delete deployment $id")
              continue
            fi
            purged=$((purged + 1))
          done < <(jq -r '.[]' "$expired_deployments")

          echo "- GitHub deployment records purged: $purged" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'GitHub deployment record cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # Environments are per-run (`radtest-<uid>`), so unlike the application
      # there is more than one candidate. Still matched by the suite's own
      # prefix and still age-gated, so a live run's environment is never a
      # candidate.
      #
      # Gated on the deployment-record purge as well: a deployment record names
      # the environment it deployed to but outlives it, so deleting the
      # environment while its records are still present strands them behind a
      # name nothing will match again. Leaving the environment in place instead
      # lets the next sweep retry both.
      - name: Purge stale GitHub Environments
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success' && steps.deployment-records-cleanup.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          ENVIRONMENT_PREFIX: ${{ steps.pin.outputs.environment-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          environments="$RUNNER_TEMP/environments.json"
          expired_environments="$RUNNER_TEMP/expired-environments.json"
          gh api --paginate --slurp "repos/$FIXTURE_REPOSITORY/environments" >"$environments"

          node --input-type=module - \
            "$environments" "$ENVIRONMENT_PREFIX" "$cutoff" "$expired_environments" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [environmentsFile, prefix, cutoff, outputFile] = process.argv.slice(2);
          const { selectExpiredEnvironments } = await import(
            "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
          );
          const environments = JSON.parse(await readFile(environmentsFile, "utf8"));
          await writeFile(
            outputFile,
            JSON.stringify(selectExpiredEnvironments(environments, prefix, cutoff))
          );
          NODE

          purged=0
          failures=()
          while read -r name; do
            [[ -n "$name" ]] || continue
            echo "Deleting stale environment $name, created before $cutoff."
            if ! gh api -X DELETE "repos/$FIXTURE_REPOSITORY/environments/$name"; then
              failures+=("delete environment $name")
              continue
            fi
            purged=$((purged + 1))
          done < <(jq -r '.[]' "$expired_environments")

          echo "- GitHub Environments purged: $purged" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'GitHub Environment cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # The workflow fallback leaves both an open pull request and a
      # `radius/setup-*` head ref. Close old fallback pull requests before
      # deleting old refs so cleanup never relies on GitHub changing PR state as
      # a side effect. Branch age comes from the referenced commit, not from a
      # missing field on the refs API.
      - name: Purge stale workflow fallback pull requests and branches
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          DEFAULT_BRANCH: ${{ steps.pin.outputs.default-branch }}
          FALLBACK_BRANCH_PREFIX: ${{ steps.pin.outputs.workflow-fallback-branch-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          pulls="$RUNNER_TEMP/fallback-pulls.json"
          refs="$RUNNER_TEMP/fallback-refs.json"
          branches="$RUNNER_TEMP/fallback-branches.json"
          expired_pulls="$RUNNER_TEMP/expired-fallback-pulls.json"
          expired_branches="$RUNNER_TEMP/expired-fallback-branches.json"

          gh api --paginate --slurp \
            "repos/$FIXTURE_REPOSITORY/pulls?state=open&per_page=100" >"$pulls"
          gh api --paginate --slurp \
            "repos/$FIXTURE_REPOSITORY/git/matching-refs/heads/$FALLBACK_BRANCH_PREFIX" >"$refs"

          printf '[]' >"$branches"
          while IFS=$'\t' read -r ref sha; do
            [[ -n "$ref" && -n "$sha" ]] || continue
            # The fallback path always authors a fresh workflow commit before
            # creating its ref, so commit time is the ref's conservative age
            # proxy. A ref whose commit cannot be read remains undeleted.
            if ! created_at="$(gh api "repos/$FIXTURE_REPOSITORY/git/commits/$sha" \
              --jq '.committer.date // empty')"; then
              echo "::warning::Could not establish the age of $ref; leaving it alone."
              created_at=""
            fi
            jq --arg ref "$ref" --arg created_at "$created_at" \
              '. += [{ref: $ref, created_at: $created_at}]' \
              "$branches" >"$branches.next"
            mv "$branches.next" "$branches"
          done < <(jq -r '.[][]? | [.ref, .object.sha] | @tsv' "$refs")

          node --input-type=module - \
            "$pulls" "$branches" "$FALLBACK_BRANCH_PREFIX" "$FIXTURE_REPOSITORY" "$DEFAULT_BRANCH" "$cutoff" \
            "$expired_pulls" "$expired_branches" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const [pullsFile, branchesFile, prefix, repository, defaultBranch, cutoff, expiredPullsFile, expiredBranchesFile] =
            process.argv.slice(2);
          const { selectExpiredFallbackBranches, selectExpiredFallbackPullRequests, selectOpenPullRequestHeadRefs } =
            await import(
              "./packages/adapter-canvas/test/e2e-cloud/support/cloud-cleanup.ts"
            );
          const [pulls, branches] = await Promise.all(
            [pullsFile, branchesFile].map(async (file) =>
              JSON.parse(await readFile(file, "utf8"))
            )
          );
          await Promise.all([
            writeFile(
              expiredPullsFile,
              JSON.stringify(
                selectExpiredFallbackPullRequests(
                  pulls,
                  prefix,
                  repository,
                  defaultBranch,
                  cutoff
                )
              )
            ),
            writeFile(
              expiredBranchesFile,
              JSON.stringify(
                selectExpiredFallbackBranches(
                  branches,
                  prefix,
                  cutoff,
                  selectOpenPullRequestHeadRefs(pulls, repository)
                )
              )
            )
          ]);
          NODE

          pulls_purged=0
          failures=()
          while read -r number; do
            [[ -n "$number" ]] || continue
            echo "Closing stale workflow fallback pull request #$number."
            if ! gh api -X PATCH "repos/$FIXTURE_REPOSITORY/pulls/$number" \
                -f state=closed >/dev/null; then
              failures+=("close pull request #$number")
              continue
            fi
            pulls_purged=$((pulls_purged + 1))
          done < <(jq -r '.[].number' "$expired_pulls")

          branches_purged=0
          while read -r branch; do
            [[ -n "$branch" ]] || continue
            echo "Deleting stale workflow fallback branch $branch."
            if ! gh api -X DELETE "repos/$FIXTURE_REPOSITORY/git/refs/heads/$branch"; then
              failures+=("delete branch $branch")
              continue
            fi
            branches_purged=$((branches_purged + 1))
          done < <(jq -r '.[]' "$expired_branches")

          echo "- Workflow fallback pull requests closed: $pulls_purged" >>"$GITHUB_STEP_SUMMARY"
          echo "- Workflow fallback branches purged: $branches_purged" >>"$GITHUB_STEP_SUMMARY"
          if (( ${#failures[@]} > 0 )); then
            printf 'Workflow fallback cleanup failures:\n' >&2
            printf '  - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      # The lease is the repository-scoped mutex used by both CI and local runs.
      # Cleanup may use an abandoned lease only after its recorded Actions owner
      # is provably complete. A local or malformed owner is unverifiable and is
      # deliberately left intact. When no lease exists, cleanup acquires its own
      # before touching the mutable default branch.
      - name: Reset the fixture default branch under the shared lease
        if: always() && steps.pin.outputs.provisioned == 'true' && steps.verify-scope.outputs.configured == 'true' && steps.app-token.outcome == 'success' && steps.radius-app-cleanup.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_GH_TOKEN: ${{ github.token }}
          FIXTURE_REPOSITORY: ${{ steps.pin.outputs.repository }}
          DEFAULT_BRANCH: ${{ steps.pin.outputs.default-branch }}
          BASELINE_SHA: ${{ steps.pin.outputs.baseline-sha }}
          LEASE_REF: ${{ steps.pin.outputs.lease-ref }}
        shell: bash
        run: |
          set -euo pipefail
          lease_read_path="repos/$FIXTURE_REPOSITORY/git/ref/${LEASE_REF#refs/}"
          lease_write_path="repos/$FIXTURE_REPOSITORY/git/$LEASE_REF"
          lease_error="$RUNNER_TEMP/cloud-e2e-lease-error.txt"
          held_lease_sha=""
          lease_held_by_us=""

          # The git refs API is eventually consistent, so a read issued right
          # after a write can 404 on a replica that has not caught up. Every
          # caller below reads the ref immediately after writing it, so retry
          # briefly rather than aborting the step while it holds the mutex.
          read_lease_sha() {
            local attempt sha
            for attempt in 1 2 3 4 5; do
              if sha="$(gh api "$lease_read_path" --jq .object.sha 2>/dev/null)" \
                  && [[ -n "$sha" ]]; then
                printf '%s' "$sha"
                return 0
              fi
              sleep "$attempt"
            done
            return 1
          }

          # Any failure between acquiring the lease and releasing it would
          # otherwise leave the mutex held by a dead run, failing every Cloud
          # E2E run until the next scheduled cleanup reclaims it. Release it
          # only while it still points at the commit this run owns so that a
          # concurrent owner is never deleted. Every outcome is reported: a
          # step that fails while holding the lease must never leave an
          # operator guessing whether the mutex is still held.
          release_orphaned_lease() {
            local status=$?
            if [[ -z "$lease_held_by_us" ]]; then return 0; fi
            if (( status == 0 )); then return 0; fi
            local current
            # Retry here too. The likeliest reason to reach this trap is that
            # the step aborted on a lagging read, in which case a single read
            # lands on the same stale replica and a lease this run is still
            # holding looks deleted.
            if ! current="$(read_lease_sha)"; then
              echo "::error::$LEASE_REF could not be read after cleanup failed while holding it; the lease may still be held. Cloud E2E stays blocked until $LEASE_REF is confirmed deleted."
              return 0
            fi
            if [[ "$current" != "$held_lease_sha" ]]; then
              echo "::warning::$LEASE_REF now points at another owner; leaving it intact after cleanup failed."
              return 0
            fi
            if gh api -X DELETE "$lease_write_path" >/dev/null 2>&1; then
              echo "::warning::Released $LEASE_REF after cleanup failed while holding it."
            else
              echo "::error::Could not release $LEASE_REF after cleanup failed while holding it; Cloud E2E stays blocked until it is deleted."
            fi
          }
          trap release_orphaned_lease EXIT

          if held_lease_sha="$(gh api "$lease_read_path" --jq .object.sha 2>"$lease_error")"; then
            if ! lease_message="$(gh api \
                "repos/$FIXTURE_REPOSITORY/git/commits/$held_lease_sha" \
                --jq .message)"; then
              echo "::error::Could not read the owner marker for $LEASE_REF; leaving the lease and fixture branch intact."
              exit 1
            fi
            owner_run_id="$(
              LEASE_MESSAGE="$lease_message" node --input-type=module -e '
                const pin = await import(
                  "./packages/adapter-canvas/test/e2e-cloud/support/fixture-repository.ts"
                );
                process.stdout.write(
                  pin.parseCloudE2ELeaseOwnerRunId(process.env.LEASE_MESSAGE) ?? ""
                );
              '
            )"
            if [[ -z "$owner_run_id" ]]; then
              echo "::warning::$LEASE_REF has no verifiable GitHub Actions owner; leaving the lease and fixture branch intact."
              exit 0
            fi
            if ! owner_status="$(
              GH_TOKEN="$SOURCE_GH_TOKEN" gh run view "$owner_run_id" \
                --repo "$GITHUB_REPOSITORY" --json status --jq .status
            )"; then
              echo "::error::Could not verify workflow run $owner_run_id for $LEASE_REF; leaving the lease and fixture branch intact."
              exit 1
            fi
            if [[ "$owner_status" != "completed" ]]; then
              echo "Leaving $LEASE_REF and the fixture branch intact because owner run $owner_run_id is $owner_status."
              exit 0
            fi
            echo "Reclaiming $LEASE_REF from completed owner run $owner_run_id."
            lease_held_by_us=1
          else
            if ! grep -q "HTTP 404" "$lease_error"; then
              cat "$lease_error" >&2
              echo "::error::Could not establish whether $LEASE_REF exists; leaving the fixture branch intact."
              exit 1
            fi

            tree_sha="$(gh api \
              "repos/$FIXTURE_REPOSITORY/git/commits/$BASELINE_SHA" \
              --jq .tree.sha)"
            lease_message="$(
              GITHUB_RUN_ID="$GITHUB_RUN_ID" node --input-type=module -e '
                const pin = await import(
                  "./packages/adapter-canvas/test/e2e-cloud/support/fixture-repository.ts"
                );
                process.stdout.write(
                  pin.cloudE2ELeaseCommitMessage(process.env.GITHUB_RUN_ID)
                );
              '
            )"
            held_lease_sha="$(gh api --method POST \
              "repos/$FIXTURE_REPOSITORY/git/commits" \
              -f "message=$lease_message" \
              -f "tree=$tree_sha" \
              -F "parents[]=$BASELINE_SHA" \
              --jq .sha)"
            if ! gh api --method POST "repos/$FIXTURE_REPOSITORY/git/refs" \
                -f "ref=$LEASE_REF" -f "sha=$held_lease_sha" >/dev/null; then
              # A create that reports failure may still have landed: the
              # response can be lost, or gh's own retry can meet "Reference
              # already exists" from its first attempt. Treating any readable
              # ref as a concurrent owner would abandon a write that actually
              # succeeded and wedge the mutex until the next scheduled cleanup.
              # The lease commit message carries this run's id, so its sha is
              # unique to this run and settles ownership.
              if ! created_lease_sha="$(read_lease_sha)"; then
                echo "::error::Could not acquire $LEASE_REF and could not verify a concurrent owner."
                exit 1
              fi
              if [[ "$created_lease_sha" != "$held_lease_sha" ]]; then
                echo "::warning::$LEASE_REF was acquired concurrently; leaving the fixture branch intact."
                exit 0
              fi
              echo "::warning::$LEASE_REF was created despite a failed create response; continuing as its owner."
            fi
            echo "Acquired $LEASE_REF for cleanup run $GITHUB_RUN_ID."
            lease_held_by_us=1
          fi

          if ! verify_lease_sha="$(read_lease_sha)"; then
            echo "::error::Could not re-read $LEASE_REF to confirm ownership; leaving the fixture branch intact."
            exit 1
          fi
          if [[ "$verify_lease_sha" != "$held_lease_sha" ]]; then
            echo "::error::$LEASE_REF changed while cleanup was establishing ownership; leaving the fixture branch intact."
            exit 1
          fi

          ref="repos/$FIXTURE_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH"
          current="$(gh api "$ref" --jq .object.sha)"

          if [[ "$current" != "$BASELINE_SHA" ]]; then
            # Force is required and is the point: a stopped run leaves real
            # commits on the branch, and the baseline is the only state the next
            # run is allowed to start from.
            gh api -X PATCH "repos/$FIXTURE_REPOSITORY/git/refs/heads/$DEFAULT_BRANCH" \
              -f "sha=$BASELINE_SHA" -F force=true >/dev/null
            echo "- Fixture \`$DEFAULT_BRANCH\` reset from \`$current\` to the pinned baseline" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "- Fixture \`$DEFAULT_BRANCH\` already at the pinned baseline" >>"$GITHUB_STEP_SUMMARY"
          fi

          if ! verify_lease_sha="$(read_lease_sha)"; then
            echo "::error::Could not re-read $LEASE_REF before release; the failure handler reports below whether the lease was released."
            exit 1
          fi
          if [[ "$verify_lease_sha" != "$held_lease_sha" ]]; then
            echo "::error::$LEASE_REF changed before release; leaving the new owner intact."
            exit 1
          fi
          gh api -X DELETE "$lease_write_path"
          echo "- Repository lease \`$LEASE_REF\` released" >>"$GITHUB_STEP_SUMMARY"

  notify-scheduled-result:
    name: Scheduled cleanup alert
    # A purge that fails quietly is worse than one that never ran: leaked state
    # accumulates, and every subsequent Cloud E2E run then fails its clean-slate
    # probe, which reads as a product regression until someone checks here.
    if: ${{ always() && github.event_name == 'schedule' && github.repository == 'radius-project/ai-extensions' }}
    needs:
      - purge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report or clear scheduled failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: purge=${{ needs.purge.result }}
          SCHEDULE_FAILED: ${{ needs.purge.result != 'success' }}
        shell: bash
        run: |
          title="Cloud E2E Cleanup scheduled failure"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$SCHEDULE_FAILED" == "true" ]]; then
            body="The scheduled Cloud E2E cleanup workflow failed: $RESULT. Run: $run_url. Leaked state is not being reclaimed, so expect the next Cloud E2E run to fail its clean-slate probe. See the leaked-state section of docs/eng/CLOUD_E2E_RUNBOOK.md."
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "The scheduled Cloud E2E cleanup workflow recovered. Run: $run_url"
          fi
