# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Canvas reliability

on:
  schedule:
    - cron: 17 8 * * 2
  workflow_dispatch:

permissions: {}

concurrency:
  group: canvas-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-reliability:
    name: P2-B Node reliability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run P2-B Node reliability checks
        run: pnpm run test:reliability:node

  chromium-reliability:
    name: P2-A/P2-B Chromium reliability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run P2-B Chromium reliability checks
        run: pnpm run test:reliability:chromium

      - name: Run P2-A visual baselines
        run: pnpm run test:visual

      - name: Upload retry and screenshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-reliability-evidence
          path: |
            packages/adapter-canvas/test-results
            packages/adapter-canvas/playwright-report
          if-no-files-found: ignore
          retention-days: 14
