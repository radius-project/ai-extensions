# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Canvas Reliability

on:
  # GitHub can disable scheduled workflows after 60 days without repository
  # activity. A manual dispatch or repository update re-enables the schedule.
  schedule:
    - cron: 0 8 * * 1
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate and upload the canonical visual baselines
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: Reliability (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extended reliability checks
        run: pnpm run test:reliability

      - name: Run native Windows process checks
        if: runner.os == 'Windows'
        run: pnpm run test:integration:windows-process

  visual-stability:
    name: Visual stability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run visual baselines twice
        if: ${{ !inputs.update_snapshots }}
        run: pnpm run test:visual:stability

      - name: Regenerate visual baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm run test:visual:update

      - name: Upload visual diagnostics, baselines, and retry-only report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-visual-stability
          path: |
            packages/adapter-canvas/test-results
            packages/adapter-canvas/playwright-visual-report
            packages/adapter-canvas/test/visual/__screenshots__
          if-no-files-found: warn
          retention-days: 14

  notify-scheduled-result:
    name: Scheduled reliability alert
    if: ${{ always() && github.event_name == 'schedule' }}
    needs:
      - resilience
      - visual-stability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report or clear scheduled failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: resilience=${{ needs.resilience.result }}, visual-stability=${{ needs.visual-stability.result }}
          SCHEDULE_FAILED: ${{ needs.resilience.result != 'success' || needs.visual-stability.result != 'success' }}
        shell: bash
        run: |
          title="Canvas Reliability scheduled failure"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$SCHEDULE_FAILED" == "true" ]]; then
            body="The scheduled Canvas Reliability workflow failed: $RESULTS. Run: $run_url"
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "The scheduled Canvas Reliability workflow recovered. Run: $run_url"
          fi
