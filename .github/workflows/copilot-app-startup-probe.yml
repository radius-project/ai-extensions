---
name: Copilot app startup probe
on:
  push:
    branches:
      - nicolejms-cloud-e2e-run
    paths:
      - .github/workflows/copilot-app-startup-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Install app
        shell: pwsh
        run: |
          winget install --exact --id GitHub.CopilotApp --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "App installation failed: $LASTEXITCODE" }
      - name: Compare isolated and default startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\GitHub Copilot\github.exe'
          foreach ($location in @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")) {
            Write-Output "Runtime location: $location"
            if (Test-Path $location) { Get-ChildItem $location | Select-Object Name }
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          foreach ($mode in @('isolated', 'default')) {
            $root = Join-Path $env:RUNNER_TEMP "copilot-probe-$mode"
            New-Item -ItemType Directory -Force $root | Out-Null
            $start = [System.Diagnostics.ProcessStartInfo]::new($exe)
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Environment['WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS'] = '--remote-debugging-port=9222'
            if ($mode -eq 'isolated') {
              $paths = @{
                USERPROFILE = $root
                HOME = $root
                APPDATA = "$root\AppData\Roaming"
                LOCALAPPDATA = "$root\AppData\Local"
                COPILOT_HOME = "$root\.copilot"
                WEBVIEW2_USER_DATA_FOLDER = "$root\webview2"
                TEMP = "$root\temp"
                TMP = "$root\temp"
              }
              foreach ($entry in $paths.GetEnumerator()) {
                New-Item -ItemType Directory -Force $entry.Value | Out-Null
                $start.Environment[$entry.Key] = $entry.Value
              }
              $start.Environment['HOMEDRIVE'] = [IO.Path]::GetPathRoot($root).Substring(0, 2)
              $start.Environment['HOMEPATH'] = $root.Substring(2)
            }
            $app = [System.Diagnostics.Process]::Start($start)
            $stdout = $app.StandardOutput.ReadToEndAsync()
            $stderr = $app.StandardError.ReadToEndAsync()
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              do {
                try {
                  $version = Invoke-RestMethod http://127.0.0.1:9222/json/version -TimeoutSec 2
                  Write-Output "$mode CDP ready: $($version.Browser)"
                  break
                } catch {
                  Write-Output "$mode CDP not ready: $($_.Exception.Message)"
                }
                if ($app.HasExited) { break }
                Start-Sleep -Seconds 2
              } while ([DateTime]::UtcNow -lt $deadline)
              Get-Process | Where-Object { $_.ProcessName -match 'github|msedgewebview' } | Select-Object Id, ProcessName, MainWindowTitle
              Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
                Select-Object ProcessId, ParentProcessId, CommandLine | Format-List
              Get-NetTCPConnection -State Listen |
                Where-Object { $_.LocalPort -eq 9222 } |
                Select-Object LocalAddress, LocalPort, OwningProcess | Format-List
              foreach ($url in @('http://[::1]:9222/json/version', 'http://localhost:9222/json/version')) {
                try { Invoke-RestMethod $url -TimeoutSec 2 | ConvertTo-Json }
                catch { Write-Output "$url failed: $($_.Exception.Message)" }
              }
              $windows = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Children,
                [System.Windows.Automation.Condition]::TrueCondition)
              foreach ($window in $windows) {
                if ($window.Current.ProcessId -eq $app.Id) {
                  Write-Output "Window: $($window.Current.Name)"
                  $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) |
                    ForEach-Object { $_.Current.Name } | Select-Object -First 30
                }
              }
            } finally {
              if (-not $app.HasExited) { taskkill /PID $app.Id /T /F }
              $app.WaitForExit()
              Write-Output "$mode exit: $($app.ExitCode)"
              Write-Output $stdout.GetAwaiter().GetResult()
              Write-Output $stderr.GetAwaiter().GetResult()
            }
          }
