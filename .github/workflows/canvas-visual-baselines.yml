# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Canvas Visual Baselines

# Adding the `pr:update-visual-baselines` label regenerates the canonical
# Canvas visual baselines for a pull request. The label is the explicit human
# confirmation that the rendering change is intended.
#
# This workflow runs pull request code, so it holds only a read-only token and
# no secrets. It uploads the regenerated PNGs, and the separate
# `canvas-visual-baselines-commit.yml` workflow, which always runs from the
# default branch, validates and commits them. Branches in forks cannot be
# pushed to, so fork pull requests get an error that explains the local command
# instead.
on:
  pull_request:
    types:
      - labeled

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  LABEL: pr:update-visual-baselines
  SNAPSHOTS: packages/adapter-canvas/test/visual/__screenshots__

jobs:
  # The commit workflow looks this job up by name.
  render:
    name: Regenerate baselines
    if: >-
      ${{ github.event.label.name == 'pr:update-visual-baselines' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Visual comparisons checks the pull request merge commit, so render the
      # same tree; rendering the bare head would loop whenever the base branch
      # has changed rendering since the pull request branched.
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Confirm the merge commit is for the labeled head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          merged_head="$(git rev-parse HEAD^2)"
          if [[ "$merged_head" != "$HEAD_SHA" ]]; then
            echo "::error::The pull request changed after the label was added. Add the $LABEL label again."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Regenerate canonical visual baselines
        run: node scripts/canvas-visual.mjs update

      - name: Stage changed baselines
        id: diff
        env:
          STAGED: ${{ runner.temp }}/canvas-visual-baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGED"
          while IFS= read -r -d '' file; do
            cp -- "$file" "$STAGED/"
          done < <(git ls-files -z --modified --others --exclude-standard -- "$SNAPSHOTS")
          if [[ -n "$(ls -A "$STAGED")" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The commit workflow treats a missing artifact as "no baseline changed".
      - name: Upload regenerated baselines
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-visual-baselines
          path: ${{ runner.temp }}/canvas-visual-baselines/
          if-no-files-found: error
          retention-days: 7

      - name: Upload update diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-visual-baselines-diagnostics
          path: |
            packages/adapter-canvas/test-results
            packages/adapter-canvas/playwright-visual-report
          if-no-files-found: warn
          retention-days: 14

  fork:
    name: Explain fork baseline updates
    if: >-
      ${{ github.event.label.name == 'pr:update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain the local update command
        shell: bash
        run: |
          message="Baselines cannot be committed to a branch in a fork. Run pnpm test:visual:canonical:update locally (requires Docker), review every changed PNG under packages/adapter-canvas/test/visual/__screenshots__/, and push them."
          echo "::error title=Canvas visual baselines::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
