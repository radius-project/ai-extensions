# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Canvas Visual Baselines

# Adding the `pr:update-visual-baselines` label regenerates the canonical
# Canvas visual baselines for a pull request and commits any that changed to its
# branch. The label is the explicit human confirmation that the rendering change
# is intended; the commit then re-runs Visual comparisons on the new head.
#
# Rendering runs pull request code, so it happens in a job with a read-only
# token and no secrets. A separate job validates the regenerated PNGs and is the
# only place the GitHub App token exists. Branches in forks cannot be pushed to,
# so fork pull requests get an error that explains the local command instead.
on:
  pull_request:
    types:
      - labeled

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  LABEL: pr:update-visual-baselines
  SNAPSHOTS: packages/adapter-canvas/test/visual/__screenshots__

jobs:
  render:
    name: Regenerate baselines
    if: >-
      ${{ github.event.label.name == 'pr:update-visual-baselines' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      # Visual comparisons checks the pull request merge commit, so render the
      # same tree; rendering the bare head would loop whenever the base branch
      # has changed rendering since the pull request branched.
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Confirm the merge commit is for the labeled head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          merged_head="$(git rev-parse HEAD^2)"
          if [[ "$merged_head" != "$HEAD_SHA" ]]; then
            echo "::error::The pull request changed after the label was added. Add the $LABEL label again."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Regenerate canonical visual baselines
        run: node scripts/canvas-visual.mjs update

      - name: Stage changed baselines
        id: diff
        env:
          STAGED: ${{ runner.temp }}/canvas-visual-baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGED"
          while IFS= read -r -d '' file; do
            cp -- "$file" "$STAGED/"
          done < <(git ls-files -z --modified --others --exclude-standard -- "$SNAPSHOTS")
          if [[ -n "$(ls -A "$STAGED")" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regenerated baselines
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-visual-baselines
          path: ${{ runner.temp }}/canvas-visual-baselines/
          if-no-files-found: error
          retention-days: 7

      - name: Upload update diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-visual-baselines-diagnostics
          path: |
            packages/adapter-canvas/test-results
            packages/adapter-canvas/playwright-visual-report
          if-no-files-found: warn
          retention-days: 14

  commit:
    name: Commit baselines
    needs:
      - render
    if: ${{ needs.render.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.push.outputs.commit }}
      files: ${{ steps.apply.outputs.files }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download regenerated baselines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canvas-visual-baselines
          path: ${{ runner.temp }}/canvas-visual-baselines

      - name: Validate and stage regenerated baselines
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          files="$(node scripts/canvas-visual-baselines.mjs apply "$RUNNER_TEMP/canvas-visual-baselines")"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "files<<$delimiter"
            echo "$files"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        if: ${{ steps.apply.outputs.changed == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_MANAGER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_MANAGER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ai-extensions
          permission-contents: write

      # The Git Data API creates a commit that GitHub signs for the App, and a
      # push by the App, unlike one by GITHUB_TOKEN, re-runs pull request checks.
      # Fast-forwarding from the rendered head refuses to drop a newer push.
      - name: Commit to the pull request branch
        if: ${{ steps.apply.outputs.changed == 'true' }}
        id: push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          FILES: ${{ steps.apply.outputs.files }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PARENT: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r file; do
            if [[ -n "$file" ]]; then
              paths+=(--path "$file")
            fi
          done <<< "$FILES"
          message="test(canvas): update visual baselines

          Regenerated by the $LABEL label on #$PR.

          Signed-off-by: radius-release-manager[bot] <323233809+radius-release-manager[bot]@users.noreply.github.com>"
          commit="$(
            node scripts/verified-git.mjs commit \
              --parent "$PARENT" \
              --message "$message" \
              "${paths[@]}" | jq -r .commit
          )"
          node scripts/verified-git.mjs ref \
            --name "refs/heads/$BRANCH" \
            --sha "$commit" \
            --fast-forward
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  report:
    name: Report baseline update
    needs:
      - render
      - commit
    if: >-
      ${{ always() &&
      github.event.label.name == 'pr:update-visual-baselines' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Update pull request status comment
        env:
          CHANGED: ${{ needs.render.outputs.changed }}
          COMMIT: ${{ needs.commit.outputs.commit }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          FILES: ${{ needs.commit.outputs.files }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RENDER_RESULT: ${{ needs.render.result }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$RENDER_RESULT" != "success" ]]; then
            state=update-failed
          elif [[ "$CHANGED" != "true" ]]; then
            state=unchanged
          elif [[ "$COMMIT_RESULT" != "success" ]]; then
            state=update-failed
          elif [[ -z "$COMMIT" ]]; then
            state=unchanged
          else
            state=updated
            args+=(--commit "$COMMIT")
            while IFS= read -r file; do
              if [[ -n "$file" ]]; then
                args+=(--file "$file")
              fi
            done <<< "$FILES"
          fi
          node scripts/canvas-visual-baselines.mjs comment \
            --pr "$PR" \
            --state "$state" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${args[@]}"

      # Removing the label lets the author add it again after another change.
      - name: Remove the update label
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$LABEL" >/dev/null; then
            echo "::warning::Could not remove the $LABEL label. Remove it before adding it again."
          fi

  fork:
    name: Explain fork baseline updates
    if: >-
      ${{ github.event.label.name == 'pr:update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain the local update command
        shell: bash
        run: |
          message="Baselines cannot be committed to a branch in a fork. Run pnpm test:visual:canonical:update locally (requires Docker), review every changed PNG under packages/adapter-canvas/test/visual/__screenshots__/, and push them."
          echo "::error title=Canvas visual baselines::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
