# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Live upstream tests

# Runs the opt-in `*.live.test.ts` suites that fetch the real workflow templates
# from radius-project/ai-extensions `.github/extension/` at runtime and assert
# YAML validity plus the OIDC environment-binding contract. A failure means a
# template change broke what the extension generates (e.g. the invalid-YAML
# deploy regression in #407).
#
# This is a SEPARATE workflow from the hermetic Build suite (build.yml), which
# stays fully offline and deterministic. These live suites are intentionally
# excluded from that suite and from the publish/release pipeline because they are
# non-hermetic: they depend on a moving ref and on network access to
# raw.githubusercontent.com.
#
# The generated Radius definition compatibility job is more isolated still: it
# runs only nightly or by manual dispatch. It downloads the latest stable rad
# release, verifies its published checksum, and resolves real generated
# definitions from the exact source commit reported by that binary. This catches
# release/schema drift without adding a mutable release dependency to PR checks.
#
# The workflow-template suites run on every pull request and every push to `main`
# so an upstream template regression is flagged immediately as a failed check,
# plus nightly as a catch-all in case no PR lands between an upstream change and
# the next run.
#
# On pull requests the suites fetch the PR's OWN templates (RADIUS_LIVE_REF is
# set to the PR head SHA below), so a PR validates the templates it actually
# ships. Pushes to `main`, nightly, and manual runs fall back to the pushed SHA
# (effectively `main`), surfacing any regression that has already landed.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 07:00 UTC daily (~midnight US Pacific), as a catch-all between pushes.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  live:
    name: Live upstream template tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Enables the `describe.skipIf(!LIVE)` blocks in the workflow live tests
      # (workflow-yaml.live.test.ts, oidc-environment-contract.live.test.ts,
      # and verify-marker.live.test.ts).
      RUN_LIVE_WORKFLOW_TESTS: "1"
      # The Canvas template fetcher shells out to `gh` rather than fetching raw
      # URLs, and `gh` requires an explicit token under Actions. Read-only, and
      # scoped by the job's `contents: read` permission. Set at the job level
      # because the recursive `pnpm test` step also runs the Canvas live test.
      GH_TOKEN: ${{ github.token }}
      # Enables the `az` argument-contract test for the Azure OIDC deploy
      # preflight (deploy-dispatch-az-contract.live.test.ts). The Azure CLI is
      # preinstalled on GitHub-hosted ubuntu runners; the test only checks that
      # `az` parses the arguments, so it needs no login and touches no cloud
      # resources.
      RUN_LIVE_AZ_CLI_TESTS: "1"
      # Validate the templates on the ref under test. On pull requests this is the
      # PR head SHA, so the suite fetches the PR's own `.github/extension/`
      # templates; on push/schedule/dispatch it is the pushed SHA (effectively
      # `main`). The live tests fall back to RADIUS_REF when this is unset.
      RADIUS_LIVE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the PR head (not the default merge commit) so the parity
          # test's working-tree read of `.github/extension/` matches the SHA the
          # API-based live suites fetch via RADIUS_LIVE_REF. Falls back to the
          # pushed SHA on push/schedule/dispatch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install yq
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YQ_VERSION: v4.53.3
        run: bash .github/extension/actions/load-contrib-catalog/install-yq.sh

      - name: Run live upstream workflow tests
        env:
          # The templates live in this internal repo, so the live suites read
          # them through the authenticated GitHub contents API rather than
          # anonymous raw.githubusercontent.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test -- src/workflows/workflow-yaml.live.test.ts src/workflows/oidc-environment-contract.live.test.ts src/workflows/extension-parity.live.test.ts

      - name: Verify live contrib workflow consumers
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          bash build/scripts/verify-contrib-consumers.sh

      - name: Run live verify marker round trip
        working-directory: packages/adapter-canvas
        run: pnpm exec vitest run src/verify-marker.live.test.ts

      - name: Run live Azure CLI contract test
        working-directory: packages/adapter-canvas
        run: pnpm exec vitest run src/server/services/deploy-dispatch-az-contract.live.test.ts

  radius-type-compatibility:
    name: Latest Radius definition compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest stable Radius CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/radius-cli"
          mkdir -p "$install_dir"
          gh release download \
            --repo radius-project/radius \
            --pattern rad_linux_amd64 \
            --pattern rad_linux_amd64.sha256 \
            --dir "$install_dir"
          cd "$install_dir"
          sha256sum --check rad_linux_amd64.sha256
          chmod +x rad_linux_amd64
          mv rad_linux_amd64 rad
          echo "RADIUS_RAD_BINARY=$install_dir/rad" >> "$GITHUB_ENV"

      - name: Resolve real generated Radius definitions
        working-directory: packages/adapter-canvas
        env:
          RUN_LIVE_RADIUS_TYPE_DEFINITION_TESTS: "1"
        run: pnpm exec vitest run test/integration/runtime/radius-type-definition.live.test.ts
