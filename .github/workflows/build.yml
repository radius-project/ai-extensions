# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Build

# Runs the full check suite and produces the installable plugin at
# plugins/<plugin>/dist, uploaded as the `plugin-dist-<plugin>` artifact.
#
# One call runs shared validation once and builds every requested plugin in a
# matrix. The publishing workflows pass a JSON selection; direct pull requests
# discover all plugins automatically.
#
# Triggered directly for pull requests, and called by publish.yml (edge channel,
# on every push to main) and release.yml (release channel, on demand) so a
# publish builds exactly once instead of duplicating this job.

on:
  pull_request:
  workflow_call:
    inputs:
      channel:
        description: >-
          `edge` stamps a throwaway prerelease version computed by Changesets;
          `release` ships the version already committed to the manifests.
        type: string
        default: edge
      plugins:
        description: >-
          JSON array of plugin names to build. Empty discovers every plugin.
        type: string
        default: ""
      ref:
        description: Git ref or commit to build. Defaults to the triggering ref.
        type: string
        default: ""
permissions: {}

jobs:
  plugin-matrix:
    name: Resolve the plugin matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.plugins.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select the plugins
        id: plugins
        env:
          REQUESTED: ${{ inputs.plugins }}
        run: |
          set -euo pipefail
          names="$(node scripts/plugins.mjs --select "$REQUESTED")"
          echo "names=$names" >>"$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    # Deliberately a separate job rather than a `parallel` step group inside
    # the build job. These checks are CPU-bound and single-threaded, and the
    # runner only has two cores, so sharing them buys nothing; a second runner
    # is what actually removes this work from the critical path.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check derived versions
        run: pnpm run version:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  windows-process-integration:
    name: Windows process integration
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows process integration tests
        run: pnpm run test:integration:windows-process

  canvas-chromium:
    name: Canvas Chromium (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright pins workers to 1 because the canvas server module keeps
    # process-global listing caches and shared credentials. Shards are separate
    # processes on separate runners, so they parallelize without that hazard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest browser mode, not Playwright, so `--shard` does not apply. Run it
      # once instead of duplicating it in every shard.
      - name: Run Canvas browser component tests
        if: matrix.shard == 1
        run: pnpm run test:component

      # No `--` before the flag: pnpm v11 consumes that separator instead of
      # forwarding it, which silently runs the whole suite in every shard.
      - name: Run Chromium Canvas tests
        run: pnpm run test:chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Chromium diagnostics and retry-only reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            packages/adapter-canvas/test-results
            packages/adapter-canvas/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  node-tests:
    name: Node tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Node tests with coverage
        id: coverage
        run: pnpm run coverage

      - name: Write coverage summary
        if: ${{ always() && steps.coverage.outcome != 'skipped' }}
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage reports
        if: ${{ always() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Check progress demo bundle
        run: pnpm --filter @radius-project/adapter-canvas run demo:check

  build-gate:
    name: Shared release gate
    needs: [static-checks, windows-process-integration, canvas-chromium, node-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record successful shared validation
        run: echo "shared validation passed" >"$RUNNER_TEMP/build-gate"

      - name: Upload shared release gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-gate
          path: ${{ runner.temp }}/build-gate
          if-no-files-found: error

  build:
    name: Build ${{ matrix.plugin }} dist
    needs: plugin-matrix
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugin-matrix.outputs.names) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # `changeset version` looks up the commit that added each changeset. In
          # a shallow clone it recovers by running `git fetch --deepen`, which
          # cannot authenticate once the checkout credential is dropped below.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every plugin-scoped name - directory, dist path, artifact - comes from
      # the registry, so no workflow hard-codes a plugin.
      - name: Resolve the plugin
        run: node scripts/plugins.mjs --env "${{ matrix.plugin }}" >>"$GITHUB_ENV"

      # edge:    Changesets owns versioning, so ask it what the next release
      #          will be instead of guessing from the manifest. --snapshot
      #          stamps the calculated version (see snapshot.useCalculatedVersion
      #          in .changeset/config.json) with an `edge` prerelease tag and the
      #          short SHA of the commit being built (snapshot.prereleaseTemplate),
      #          e.g. 0.1.0-edge-0b33186. That sorts below the release it
      #          precedes and above the last stable release, and names the
      #          source commit so a published build is traceable. Precedence
      #          between two edge builds is lexical, not chronological, and
      #          nothing reads it: installs resolve the moving `<plugin>@edge`
      #          ref and publish.yml orders builds by git ancestry. This rewrites
      #          plugins/<plugin>/package.json and .changeset/config.json in the
      #          CI workspace only — nothing is committed. An ephemeral patch
      #          changeset makes documentation-only pushes snapshot the next
      #          patch when no package changeset is pending; an existing minor
      #          or major changeset still takes precedence.
      # release: `changeset version` already committed the version to main, so
      #          ship it verbatim. The release workflow tags it after checks.
      - name: Resolve version
        id: version
        env:
          CHANNEL: ${{ inputs.channel || 'edge' }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "release" ]; then
            version="$(node scripts/version.mjs --plugin "$PLUGIN_NAME")"
          elif [ "$CHANNEL" = "edge" ]; then
            # Only the version is read back, so drop the changelog generator:
            # @changesets/changelog-github costs one GitHub GraphQL lookup per
            # pending changeset and fails the publish whenever that call does.
            config="$(mktemp)"
            jq '.changelog = false' .changeset/config.json >"$config"
            mv "$config" .changeset/config.json

            pnpm exec changeset add --patch "$PLUGIN_NAME" \
              --message 'Publish the current commit to the rolling edge channel.'
            node scripts/release-version.mjs \
              --plugin "$PLUGIN_NAME" --snapshot edge
            version="$(node scripts/version.mjs --plugin "$PLUGIN_NAME")"
          else
            echo "::error::Unsupported build channel: $CHANNEL"
            exit 1
          fi
          echo "Stamping $PLUGIN_NAME dist as ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Each plugin package owns a `build` script that assembles its own dist/.
      - name: Build
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter "$PLUGIN_NAME" run build

      # Runs against the exact bundle uploaded below. This intentionally stays
      # after Build rather than relying on a pre-existing workspace artifact.
      # It reruns the build itself, so it needs the same stamp to leave dist/
      # byte-identical to what Build produced.
      - name: Run built-artifact smoke tests
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter "$PLUGIN_NAME" run test:artifact

      - name: Verify the plugin dist is complete
        run: >-
          node scripts/validate-plugin-dist.mjs
          --plugin "$PLUGIN_NAME"
          --version "${{ steps.version.outputs.version }}"

      - name: Upload plugin dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PLUGIN_ARTIFACT }}
          path: ${{ env.PLUGIN_DIST }}
          if-no-files-found: error
