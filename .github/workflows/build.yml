# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Build

# Runs the full check suite and produces the installable plugin at
# plugins/radius/dist, uploaded as the `plugin-dist` artifact.
#
# Triggered directly for pull requests, and called by publish.yml on pushes to
# main so a merge builds exactly once instead of duplicating this job.

on:
  pull_request:
  workflow_call:
    outputs:
      version:
        description: Version stamped into the built plugin manifests.
        value: ${{ jobs.build.outputs.version }}

permissions: {}

jobs:
  build:
    name: Build plugin dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.edge_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run unit tests
        run: pnpm run test

      # Changesets owns versioning, so ask it what the next release will be
      # instead of guessing from the manifest: --snapshot stamps the calculated
      # version (see snapshot.useCalculatedVersion in .changeset/config.json)
      # with an `edge` prerelease tag, e.g. 0.1.0-edge-20260807014054. That
      # sorts below the release it precedes and above anything already shipped.
      # This rewrites plugins/radius/package.json in the CI workspace only —
      # nothing is committed.
      - name: Compute edge version
        id: edge_version
        run: |
          set -euo pipefail
          pnpm exec changeset version --snapshot edge
          version="$(node -p "require('./plugins/radius/package.json').version")"
          case "$version" in
            *-edge-*) ;;
            *)
              # No pending changesets, so Changesets had nothing to bump. Label
              # the current version as an edge build of itself so a publish is
              # never mistaken for a real release.
              core="${version%%+*}"
              version="${core%%-*}-edge-$(date -u +%Y%m%d%H%M%S)"
              ;;
          esac
          echo "Stamping plugin dist as ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PLUGIN_VERSION: ${{ steps.edge_version.outputs.version }}
        run: pnpm run build

      - name: Upload plugin dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-dist
          path: plugins/radius/dist
          if-no-files-found: error
