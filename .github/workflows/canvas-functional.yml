# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Canvas Functional Tests

on:
  # GitHub can disable scheduled workflows after 60 days without repository
  # activity. A manual dispatch or repository update re-enables the schedule.
  schedule:
    # Three hermetic visual comparison runs per day.
    - cron: "17 */8 * * *"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate and upload the canonical visual baselines
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Run canonical visual stability comparisons
        if: ${{ !inputs.update_snapshots }}
        run: pnpm run test:visual:canonical

      - name: Regenerate canonical visual baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm run test:visual:canonical:update

      - name: Upload visual diagnostics, baselines, and retry-only report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-visual-functional
          path: |
            packages/adapter-canvas/test-results
            packages/adapter-canvas/playwright-visual-report
            packages/adapter-canvas/test/visual/__screenshots__
          if-no-files-found: warn
          retention-days: 14

  notify-scheduled-result:
    name: Scheduled functional alert
    if: ${{ always() && github.event_name == 'schedule' }}
    needs:
      - visual
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report or clear scheduled failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: visual=${{ needs.visual.result }}
          SCHEDULE_FAILED: ${{ needs.visual.result != 'success' }}
        shell: bash
        run: |
          title="Canvas Functional Tests scheduled failure"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$SCHEDULE_FAILED" == "true" ]]; then
            body="The recurring post-merge Canvas functional workflow failed: $RESULT. Run: $run_url"
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "The scheduled Canvas functional workflow recovered. Run: $run_url"
          fi
