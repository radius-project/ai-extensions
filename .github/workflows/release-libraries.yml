# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release npm libraries

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-npm-libraries
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      channel: release
      ref: ${{ github.sha }}
    permissions:
      contents: read

  candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require committed versions and release notes
        run: |
          mkdir -p .artifacts/libraries
          node scripts/library-release.mjs > .artifacts/libraries/release-plan.json

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and verify the exact npm tarballs with React 18 and 19
        run: pnpm run test:integration:libraries

      - name: Provision the pinned Headlamp qualification host
        run: |
          docker build \
            --tag radius-canvas-visual:playwright-1.62.1-node-24.19.0 \
            --file packages/adapter-canvas/test/visual/Dockerfile .
          docker build \
            --tag radius-headlamp-qualification:0.45.0 \
            --file scripts/fixtures/headlamp/Dockerfile scripts/fixtures/headlamp

      - name: Qualify the exact tarballs in Headlamp
        run: |
          node scripts/test-headlamp.mjs \
            --candidates .artifacts/libraries/packages \
            --output .artifacts/headlamp-release

      # Include build dependencies because Dagre, graphlib and lodash are bundled.
      - name: Generate per-library SPDX inventories
        run: |
          pnpm --filter @radius-project/core --filter @radius-project/graph-react \
            sbom --sbom-format spdx --split --out .artifacts/libraries/%s.spdx.json

      - name: Upload the qualified release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-library-release
          path: |
            .artifacts/libraries/packages/*.tgz
            .artifacts/libraries/release-plan.json
            .artifacts/libraries/*.spdx.json
            .artifacts/headlamp-release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tools without dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js and npm for OIDC
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the qualified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-library-release
          path: .artifacts/npm-release

      - name: Require a verified release source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq .commit.verification.verified)"
          if [[ "$verified" != "true" ]]; then
            echo "::error::The qualified source commit must have a verified signature."
            exit 1
          fi

      - name: Publish the qualified tarballs with npm provenance
        run: node scripts/publish-libraries.mjs .artifacts/npm-release/libraries

      - name: Attach packages, SPDX inventory and qualification to a source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="graph-libraries-${SOURCE_SHA}"
          bundle="$RUNNER_TEMP/graph-libraries.tar.gz"
          tar -czf "$bundle" -C .artifacts/npm-release .
          jq -r '.[] | "## \(.name)@\(.version)\n\n\(.notes)\n"' \
            .artifacts/npm-release/libraries/release-plan.json > "$RUNNER_TEMP/notes.md"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" != "$SOURCE_SHA" ]]; then
            echo "::error::The library release tag does not match the qualified source."
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft \
              --title "Graph libraries ${SOURCE_SHA:0:12}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release upload "$tag" "$bundle" \
              .artifacts/npm-release/libraries/*.spdx.json --clobber
            gh release edit "$tag" --draft=false --latest=false
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets"
          grep -Fxq 'graph-libraries.tar.gz' "$RUNNER_TEMP/assets"
          for sbom in .artifacts/npm-release/libraries/*.spdx.json; do
            grep -Fxq "$(basename "$sbom")" "$RUNNER_TEMP/assets"
          done
