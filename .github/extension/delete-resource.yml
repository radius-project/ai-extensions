# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
# This workflow is auto-generated by Radius. It deletes ONE resource inside a
# deployed Radius application — a resource the application definition no longer
# declares but that is still deployed, because deployment is incremental.
#
# It is deliberately a separate dispatcher from delete-application.yml even
# though both call the same reusable provider workflows. A job that binds a
# GitHub Environment makes GitHub create a deployment record for that
# environment, and the canvas resolves an environment's deployment state from
# those records. Sharing the application-delete workflow file would make a
# successful single-resource cleanup indistinguishable from a successful
# whole-application teardown, and the application would silently disappear from
# the Deployments list. The workflow path is the operation's identity, so only
# delete-application.yml can retire an application's row.
name: Radius - Delete Resource
# The correlation id is echoed into the run name so the canvas that dispatched
# this run can identify it exactly. Without it the canvas would have to guess
# from "the newest run of this workflow", which attaches the wrong run whenever
# another resource of another environment is being deleted at the same time.
run-name: Radius - Delete Resource ${{ inputs.resource_name }} (${{ inputs.environment }}) ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment name'
        required: true
        default: '{{ENV}}'
      application:
        description: 'Name of the application that owns the resource'
        required: true
      resource_name:
        description: 'Name of the resource to delete'
        required: true
      radius_resource_type:
        description: 'Fully-qualified Radius resource type, e.g. Radius.Data/redisCaches'
        required: true
      correlation_id:
        description: 'Opaque id echoed into the run name so the dispatcher can match this exact run'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  # Bind to the GitHub Environment so environment-scoped variables are visible, then
  # pick the provider from whichever identifying variable is set. A job that calls a
  # reusable workflow (`uses:`) can't bind an environment itself, so this routing
  # decision has to happen in a regular job first.
  detect:
    name: Detect provider
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || '{{ENV}}' }}
    outputs:
      provider: ${{ steps.detect.outputs.provider }}
    steps:
      - name: Determine provider from environment variables
        id: detect
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "provider=azure" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "provider=aws" >> "$GITHUB_OUTPUT"
          else
            echo "No AZURE_CLIENT_ID or AWS_ROLE_ARN set on this environment." >&2
            echo "provider=none" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  azure:
    name: Azure
    needs: detect
    if: ${{ needs.detect.outputs.provider == 'azure' }}
    uses: ./.github/workflows/delete-azure.yml
    with:
      environment: ${{ inputs.environment || '{{ENV}}' }}
      resource_type: resource
      # `name` is the resource's own name; `application` scopes the ownership
      # check the composite action performs before it deletes anything.
      name: ${{ inputs.resource_name }}
      application: ${{ inputs.application }}
      radius_resource_type: ${{ inputs.radius_resource_type }}
    secrets: inherit

  aws:
    name: AWS
    needs: detect
    if: ${{ needs.detect.outputs.provider == 'aws' }}
    uses: ./.github/workflows/delete-aws.yml
    with:
      environment: ${{ inputs.environment || '{{ENV}}' }}
      resource_type: resource
      name: ${{ inputs.resource_name }}
      application: ${{ inputs.application }}
      radius_resource_type: ${{ inputs.radius_resource_type }}
    secrets: inherit
