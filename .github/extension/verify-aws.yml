# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Radius - Verify Credentials
on:
  push:
    branches:
      - "radius/setup-**"
    paths:
      - ".github/workflows/radius-verify-credentials.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        required: true
        default: '{{ENV}}'

permissions:
  id-token: write
  contents: read
  # Mirrors the run-rad-commands deploy workflow so the GHCR push-permission
  # check below tests the same token capability the deploy will rely on.
  packages: write

# The steps only read AWS and the cluster. The GHCR check starts an upload
# that it never completes, so it creates no package version.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment || '{{ENV}}' }}
    steps:
      - name: Validate inputs
        timeout-minutes: 1
        uses: radius-project/ai-extensions/.github/extension/actions/validate-aws-inputs@{{RADIUS_REF}}
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          account-id: ${{ vars.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}
          cluster-name: ${{ vars.AWS_EKS_CLUSTER_NAME }}
          subnet-ids: ${{ vars.RADIUS_SUBNET_IDS }}
          require-subnets: "true"

      - name: Configure AWS Credentials
        timeout-minutes: 3
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Credentials
        timeout-minutes: 1
        run: |
          aws sts get-caller-identity
          echo "✅ AWS OIDC login successful"

      - name: Check the deploy role's AWS account
        timeout-minutes: 1
        uses: radius-project/ai-extensions/.github/extension/actions/aws-account-check@{{RADIUS_REF}}
        with:
          account-id: ${{ vars.AWS_ACCOUNT_ID }}

      # Canvas classifies a failure by this step name and the words in the log,
      # so keep the name.
      - name: Verify EKS Access
        timeout-minutes: 3
        uses: radius-project/ai-extensions/.github/extension/actions/eks-preflight@{{RADIUS_REF}}
        with:
          region: ${{ vars.AWS_REGION }}
          cluster-name: ${{ vars.AWS_EKS_CLUSTER_NAME }}
          subnet-ids: ${{ vars.RADIUS_SUBNET_IDS }}

      - name: Verify GHCR package push permission
        timeout-minutes: 2
        uses: radius-project/ai-extensions/.github/extension/actions/verify-ghcr-push@{{RADIUS_REF}}
        with:
          state-registry: ${{ vars.RADIUS_STATE_REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coded-messages: "true"

      - name: Summary
        timeout-minutes: 1
        env:
          ENVIRONMENT: ${{ inputs.environment || '{{ENV}}' }}
        run: |
          echo "## ✅ Credentials Verified" >> $GITHUB_STEP_SUMMARY
          echo "Environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "Provider: aws" >> $GITHUB_STEP_SUMMARY
          echo "GHCR package push: ${GHCR_PUSH_CHECK:-unknown}" >> $GITHUB_STEP_SUMMARY
