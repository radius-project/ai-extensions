# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Radius - Verify Credentials
on:
  push:
    branches:
      - "radius/setup-**"
    paths:
      - ".github/workflows/radius-verify-credentials.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        required: true
        default: '{{ENV}}'

permissions:
  id-token: write
  contents: read
  # Mirrors the run-rad-commands deploy workflow so the GHCR push-permission
  # check below tests the same token capability the deploy will rely on.
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || '{{ENV}}' }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          aws sts get-caller-identity
          echo "✅ AWS OIDC login successful"

      - name: Check the deploy role's AWS account
        # Radius makes every AWS call with this role and reads only the region
        # from the environment, so a role in another account would act there
        # while Radius records the resources under AWS_ACCOUNT_ID.
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        env:
          ENVIRONMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if ! [[ "$ENVIRONMENT_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID is not a 12-digit AWS account ID. Set it in this GitHub environment's variables to the account of AWS_ROLE_ARN."
            exit 1
          fi
          # No pipe, so under bash -e a failed call fails this assignment and the step.
          ROLE_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if ! [[ "$ROLE_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::aws sts get-caller-identity returned no account for AWS_ROLE_ARN."
            exit 1
          fi
          if [ "$ROLE_ACCOUNT_ID" != "$ENVIRONMENT_ACCOUNT_ID" ]; then
            echo "::error::AWS_ROLE_ARN is in AWS account $ROLE_ACCOUNT_ID, but AWS_ACCOUNT_ID is $ENVIRONMENT_ACCOUNT_ID. Fix AWS_ROLE_ARN or AWS_ACCOUNT_ID in this GitHub environment's variables so both name the same account."
            exit 1
          fi
          echo "AWS_ROLE_ARN is in AWS account $ROLE_ACCOUNT_ID, matching AWS_ACCOUNT_ID."

      - name: Verify EKS Access
        run: |
          aws eks update-kubeconfig --name "${{ vars.AWS_EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          kubectl cluster-info
          echo "✅ EKS cluster accessible"

      - name: Verify GHCR package push permission
        uses: radius-project/ai-extensions/.github/extension/actions/verify-ghcr-push@{{RADIUS_REF}}
        with:
          state-registry: ${{ vars.RADIUS_STATE_REGISTRY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ Credentials Verified" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ inputs.environment || '{{ENV}}' }}" >> $GITHUB_STEP_SUMMARY
          echo "Provider: aws" >> $GITHUB_STEP_SUMMARY
          echo "GHCR package push: ${GHCR_PUSH_CHECK:-unknown}" >> $GITHUB_STEP_SUMMARY
