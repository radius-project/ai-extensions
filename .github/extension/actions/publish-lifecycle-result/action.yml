# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
name: Radius - Publish lifecycle result
description: Publish final evidence after state-save and control-plane cleanup.
runs:
  using: composite
  steps:
    - name: Finalize lifecycle result
      shell: bash
      run: |
        source "$RADIUS_LIFECYCLE_HELPER"
        lifecycle_finalize
    - name: Upload lifecycle result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lifecycle-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.RADIUS_LIFECYCLE_FILE }}
        if-no-files-found: error
        retention-days: 7
