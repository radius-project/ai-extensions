# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
# Provider-agnostic custom resource-type / recipe-pack apply shared by
# run-rad-commands-aws.yml and run-rad-commands-azure.yml. Runs after the
# provider-specific environment creation, pack deployment, and attachment steps.
# When the app's `.radius/` folder (alongside `.radius/app.bicep`) carries custom resource
# types, this:
#   1. registers those types from `.radius/custom-types.yaml` via
#      `rad resource-type create --from-file` (skipped when the file is absent), and
#   2. discovers the non-existing pack names authored by
#      `.radius/custom-recipe-pack.bicep`, deploys it, then attaches those exact
#      packs to the environment -- preserving
#      the environment's existing recipe packs (e.g. the default provider pack)
#      without pulling in unrelated packs the control plane may know about (skipped
#      when the file is absent).
# When neither file exists the action is a no-op, leaving the default pack in place.
name: Radius - Apply custom recipe packs
description: Register the repo's custom resource types and recipe pack (if present) and attach the authored pack to the environment alongside its existing packs.

inputs:
  environment:
    description: Radius environment name to update with the full recipe pack list.
    required: true
  app-file:
    description: Application bicep file. Its directory (e.g. .radius/) is searched for custom-types.yaml and custom-recipe-pack.bicep.
    required: true

runs:
  using: composite
  steps:
    - name: Register custom types and apply custom recipe pack
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        APP_FILE: ${{ inputs.app-file }}
      run: |
        set -euo pipefail

        # Custom type / recipe-pack files live next to the app file (e.g. .radius/).
        # Deploying from that directory lets `rad deploy` resolve the repo's own
        # .radius/bicepconfig.json (which declares the `radius` extension) -- bicep
        # resolves the config nearest the .bicep file.
        APP_DIR=$(dirname "${APP_FILE}")
        CUSTOM_TYPES_YAML="${APP_DIR}/custom-types.yaml"
        RECIPE_PACK_BICEP="${APP_DIR}/custom-recipe-pack.bicep"

        # 1. Register custom resource types with Radius. --from-file registers every
        # type defined in the manifest. Must run before deploying the recipe pack,
        # which references these types. Absent file => nothing to register.
        if [[ -f "${CUSTOM_TYPES_YAML}" ]]; then
          echo "Registering custom resource types from ${CUSTOM_TYPES_YAML}..."
          rad resource-type create --from-file "${CUSTOM_TYPES_YAML}"
          echo "✅ Custom resource types registered."
        else
          echo "No custom resource types at ${CUSTOM_TYPES_YAML};" \
            "skipping type registration."
        fi

        # 2. Deploy the custom recipe pack and attach it to the environment. Absent
        # file => nothing to deploy, keep the default pack.
        if [[ ! -f "${RECIPE_PACK_BICEP}" ]]; then
          echo "No custom recipe pack at ${RECIPE_PACK_BICEP};" \
            "keeping the default recipe pack."
          exit 0
        fi

        BICEP_BIN="${BICEP_BIN:-${BICEP:-${HOME}/.rad/bin/bicep}}"
        if [[ -d "${BICEP_BIN}" ]]; then
          BICEP_BIN="${BICEP_BIN}/bicep"
        fi
        if [[ ! -x "${BICEP_BIN}" ]]; then
          echo "Bicep compiler not found at ${BICEP_BIN}." >&2
          exit 1
        fi

        COMPILED_TEMPLATE=$(
          mktemp "${TMPDIR:-/tmp}/radius-custom-recipe-pack.XXXXXX"
        )
        trap 'rm -f "${COMPILED_TEMPLATE}"' EXIT

        echo "Discovering recipe packs declared by ${RECIPE_PACK_BICEP}..."
        "${BICEP_BIN}" build "${RECIPE_PACK_BICEP}" \
          --outfile "${COMPILED_TEMPLATE}"
        PACK_NAMES=$(jq -ce '
          # bicep build emits .resources as an object keyed by symbolic name
          # (languageVersion 2.0, always used by Radius extensibility templates)
          # or as an array (languageVersion 1.x). .resources[] iterates either.
          if (.resources | type) as $shape |
             ($shape != "object" and $shape != "array") then
            error("compiled template resources must be an object or array")
          else
            [.resources[] |
              select(
                ((.type // "") | ascii_downcase) as $type |
                $type == "radius.core/recipepacks" or
                ($type | startswith("radius.core/recipepacks@"))
              ) |
              select((.existing // false) != true)
            ] |
            if length == 0 then
              error(
                "compiled template declares no Radius.Core/recipePacks resources"
              )
            elif any(has("condition")) then
              error(
                "conditional Radius.Core/recipePacks resources are not supported; a resource that a runtime condition may skip cannot be resolved deterministically and could collide with restored state"
              )
            else
              # Radius extensibility resources carry the resource name at
              # .properties.name in compiled ARM; fall back to a top-level
              # .name for any non-extensibility encoding.
              map(.properties.name // .name) |
              if any(
                type != "string" or
                length == 0 or
                startswith("[")
              ) then
                error("recipe pack names must be non-empty string literals that do not begin with '['")
              else
                unique
              end
            end
          end
        ' "${COMPILED_TEMPLATE}")

        # Pass --environment explicitly: the recipe pack bicep only creates a
        # Radius.Core/recipePacks resource (no environment), so rad deploy would
        # otherwise require a default environment to be set. The environment was
        # created by the preceding step.
        echo "Deploying custom recipe pack from ${RECIPE_PACK_BICEP}..."
        rad deploy "${RECIPE_PACK_BICEP}" --environment "${ENVIRONMENT}"

        # Use the same exact-name resolver and preserving union as provider packs.
        # Composite actions cannot invoke another action from a run block, so call
        # the sibling action's shared implementation directly.
        export RECIPE_PACKS_JSON="${PACK_NAMES}"
        bash "${GITHUB_ACTION_PATH}/../attach-recipe-pack/attach-recipe-pack.sh"
