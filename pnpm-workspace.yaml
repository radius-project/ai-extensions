---
# registry: https://packagefeedproxy.microsoft.io/npm
packages:
  - packages/*
  - plugins/*

# Turn the "engines" ranges into install-time errors; pnpm only warns otherwise.
engineStrict: true

allowBuilds:
  esbuild: true
  koffi: true

overrides:
  read-yaml-file@<2: ^2.1.0

catalog:
  # Kept in sync with the pinned "@github/copilot-sdk" version in
  # plugins/radius/package.json by copilot-sdk-pin.test.ts. That manifest ships
  # to users without this file, so it must declare a literal version.
  "@github/copilot-sdk": 1.0.9
  # Must track the Node major in the "engines.node" range (>=24 <25) so
  # typechecking cannot reach APIs missing from the supported runtime.
  "@types/node": ^24.13.3
  # Must track the "vitest" version below; browser mode ships with the runner.
  "@vitest/browser": ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  typescript: ^7.0.2
  vitest: ^4.1.10
  # YAML parser used only by @radius-project/core tests to assert generated
  # workflow files parse as valid YAML (dev-only; core ships no runtime deps).
  # Pinned to the version already resolved in the lockfile.
  yaml: ^2.9.0

minimumReleaseAge: 11520   # 8 days
